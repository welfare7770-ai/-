<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7356">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<title>김현수 행정사 비밀노트</title>
<style>
/* 모듈마다 고유 색(--c-*)을 두고, 현재 탭의 색이 --acc로 화면 전체에 흐르는 구조 */
:root{
  --bg:#f1f4f2;--card:#ffffff;--card2:#f6f8f7;--text:#16201b;--muted:#66726c;--line:#e2e8e4;
  --shadow:0 1px 2px rgba(22,44,33,.05),0 6px 18px rgba(22,44,33,.06);
  --c-home:#1f7356;--c-ledger:#1f7356;--c-car:#2a5db0;--c-recur:#6a4cbd;--c-sched:#b4620a;
  --c-gift:#bd3a63;--c-hike:#46711f;--c-gym:#cc4f15;--c-health:#c8304a;--c-care:#8a5426;--c-assets:#0b6e8a;--c-settings:#56626b;
  --on-acc:#ffffff;--pos:#1d63ad;--neg:#c03f0b;
  --over:#b4231f;--over-bg:#fde9e7;--soon:#98600a;--soon-bg:#fcf1d6;
  --ok:#17773b;--ok-bg:#e1f3e7;--info:#2a4fc4;--info-bg:#e5ebfc;--none:#646c74;--none-bg:#ebeef0;
  --acc:var(--c-home);
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1311;--card:#191f1c;--card2:#212824;--text:#e5ebe7;--muted:#97a29c;--line:#2b3430;--shadow:none;
  --c-home:#5cc39d;--c-ledger:#5cc39d;--c-car:#7ea8f0;--c-recur:#ab95ee;--c-sched:#eea64c;
  --c-gift:#ef7d9f;--c-hike:#9dc76b;--c-gym:#f48a52;--c-health:#f27587;--c-care:#dca36c;--c-assets:#5ec3e0;--c-settings:#a5afb7;
  --on-acc:#0e1411;--pos:#7cb8f0;--neg:#f59d6b;
  --over:#fca5a0;--over-bg:#3a1c1b;--soon:#f6cf6a;--soon-bg:#382d12;
  --ok:#86e2a6;--ok-bg:#15301f;--info:#a9b8fb;--info-bg:#1f2648;--none:#b0b7bd;--none-bg:#2a3034;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1311;--card:#191f1c;--card2:#212824;--text:#e5ebe7;--muted:#97a29c;--line:#2b3430;--shadow:none;
  --c-home:#5cc39d;--c-ledger:#5cc39d;--c-car:#7ea8f0;--c-recur:#ab95ee;--c-sched:#eea64c;
  --c-gift:#ef7d9f;--c-hike:#9dc76b;--c-gym:#f48a52;--c-health:#f27587;--c-care:#dca36c;--c-assets:#5ec3e0;--c-settings:#a5afb7;
  --on-acc:#0e1411;--pos:#7cb8f0;--neg:#f59d6b;
  --over:#fca5a0;--over-bg:#3a1c1b;--soon:#f6cf6a;--soon-bg:#382d12;
  --ok:#86e2a6;--ok-bg:#15301f;--info:#a9b8fb;--info-bg:#1f2648;--none:#b0b7bd;--none-bg:#2a3034;
  color-scheme:dark;
}
body[data-tab="ledger"]{--acc:var(--c-ledger)}body[data-tab="car"]{--acc:var(--c-car)}body[data-tab="recur"]{--acc:var(--c-recur)}
body[data-tab="sched"]{--acc:var(--c-sched)}body[data-tab="gift"]{--acc:var(--c-gift)}body[data-tab="hike"]{--acc:var(--c-hike)}
body[data-tab="gym"]{--acc:var(--c-gym)}body[data-tab="health"]{--acc:var(--c-health)}body[data-tab="settings"]{--acc:var(--c-settings)}body[data-tab="care"]{--acc:var(--c-care)}body[data-tab="assets"]{--acc:var(--c-assets)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header.top{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
header.top .logo{width:26px;height:26px;border-radius:9px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;transition:background .25s}
header.top .logo svg{width:18px;height:18px}
header.top h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:700;letter-spacing:-.01em;flex:1}
#sync{font-size:11.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
nav#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:0 0 auto;display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:6px 9px;border-radius:999px;font:inherit;font-size:13px;font-weight:500}
nav#tabs button .ic{width:16px;height:16px}
nav#tabs button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
main{max-width:760px;margin:0 auto;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{font-size:14.5px;font-weight:700;margin:0 0 9px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--acc)}
.card h2 .sp{flex:1}
.nudge{display:grid;gap:8px;margin-bottom:12px}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.nrow>.ic{width:34px;height:34px;padding:7px;border-radius:10px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.nrow b{display:block;font-size:13.5px;line-height:1.4;word-break:keep-all}
.nrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px;word-break:keep-all}
.nrow .btn{flex:0 0 auto;padding:6px 10px}
.nrow.warn{background:color-mix(in srgb,var(--acc) 11%,var(--card));border:1.5px solid color-mix(in srgb,var(--acc) 55%,var(--line))}
.nrow.warn b{color:var(--acc)}
.nrow.urgent>.ic{background:var(--acc);color:var(--on-acc);animation:nudge 1.6s ease-in-out infinite}
.nrow.done b{color:var(--ok)}
.streak{display:inline-block;margin-left:4px;font-size:11.5px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:999px;padding:1px 7px;vertical-align:1px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.settle td.r b{font-size:14.5px}
.give{color:var(--neg);font-weight:700}.take{color:var(--pos);font-weight:700}
.xfer{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--card2);margin-top:6px;font-size:14px}
.xfer b{font-weight:700}.xfer .amt{margin-left:auto}
textarea.report{font-size:12.5px;min-height:180px;font-family:var(--font);margin-top:8px}
.lock{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:24px 0}
.lock-box{width:min(320px,100%);text-align:center}
.lock-box .logo{width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin:0 auto 12px}
.lock-box .logo svg{width:28px;height:28px}
.lock-box h2{margin:0 0 4px;font-size:20px}
.lock-box p{margin:0 0 18px;color:var(--muted);font-size:14px;min-height:21px}
.lock-box p.err{color:var(--over);font-weight:600}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);transition:background .1s}
.dots i.on{background:var(--acc)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:62px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;font-weight:600;box-shadow:var(--shadow)}
.pad button:active{background:color-mix(in srgb,var(--acc) 15%,var(--card))}
.pad button.sm{font-size:14px;font-weight:600;color:var(--muted)}
.linkbtn{margin-top:18px;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
#lockBtn{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;padding:0}
#lockBtn svg{width:16px;height:16px}
.hero-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.hero-two .hero-label{margin-top:4px}
.hero-two .hero-num{font-size:19px}
.hero-two .in{color:var(--pos)}.hero-two .out{color:var(--neg)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--card2);margin-top:12px;gap:2px}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend b{color:var(--text);font-weight:600}
.nw{cursor:pointer}
.nw .big{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--c-assets)}
.hold-edit{border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px;background:var(--card2)}
.he-top{display:flex;gap:8px;align-items:center}
.he-top input{font-size:14.5px;font-weight:600;background:var(--card)}
.he-top .x{border:0;background:none;color:var(--over);font-size:16px;width:30px;height:30px;flex:0 0 auto}
.he-grid{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:6px;margin-top:7px}
.he-grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.he-grid input{font-size:14.5px;background:var(--card);padding:7px 8px}
.he-sum{display:block;margin-top:6px;font-size:12.5px;color:var(--acc);font-weight:600;min-height:16px}
.acct{border-top:1px solid var(--line);padding:12px 2px}.acct:first-of-type{border-top:0}
.acct-top{display:flex;align-items:center;gap:10px;cursor:pointer}
.acct-top b{display:block;font-weight:600}.acct-top small{display:block;color:var(--muted);font-size:12.5px}
.hold{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:12.5px;color:var(--muted);margin:8px 0 0;padding:8px 10px;background:var(--card2);border-radius:10px}
.hold b{color:var(--text);font-weight:600}
.hold .r{text-align:right}
.hero{border-radius:18px;padding:13px 14px;margin-bottom:10px;background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 20%,var(--card)),color-mix(in srgb,var(--acc) 6%,var(--card)));border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:180px;height:120px;background:var(--acc);opacity:.08;clip-path:polygon(0 100%,35% 30%,55% 60%,75% 15%,100% 100%)}
.hero-date{font-size:13px;color:var(--muted);font-weight:500}
.hero-label{margin-top:6px;font-size:12px;color:var(--muted)}
.hero-num{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--acc);line-height:1.2}
.hero-sub{font-size:12.5px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:6px 9px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .pill{margin-top:3px;display:inline-block}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:7px 2px 6px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow)}
.quick button .ic{width:28px;height:28px;padding:6px;border-radius:11px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
@media (max-width:480px){.quick{grid-template-columns:repeat(3,1fr)}}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-act]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 11px;font-weight:600}
.btn.primary,button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.danger{color:var(--over)!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.monthnav{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12.5px}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.daygrp{font-size:12.5px;color:var(--muted);margin:14px 2px 2px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pill{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.over{color:var(--over);background:var(--over-bg)}.pill.soon{color:var(--soon);background:var(--soon-bg)}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.info{color:var(--info);background:var(--info-bg)}
.pill.none{color:var(--none);background:var(--none-bg)}
.bar{height:8px;background:color-mix(in srgb,var(--acc) 12%,var(--card2));border-radius:99px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warn span{background:var(--soon)}.bar.over span{background:var(--over)}
.goal{font-size:13.5px;margin-bottom:10px}.goal:last-child{margin-bottom:0}
.goal div:first-child{display:flex;justify-content:space-between;gap:8px}
.catrow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:7px 0}
.catrow .bar{margin:0}
.insights{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.insights b{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:16px 0;margin:0;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,15,.5)}
#dlgForm{padding:0 18px;overflow:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overscroll-behavior:contain}
#dlgForm h2{margin:0 -18px 10px;padding:10px 10px 9px 18px;font-size:15.5px;position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#dlgForm h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
.dlgx{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.dlgx:hover{background:var(--line)}
.fld input::placeholder,.rule input::placeholder{color:var(--muted);opacity:.55;font-style:italic}
.bad{outline:2px solid var(--over)!important;outline-offset:1px}
.errmsg{color:var(--over);font-size:12.5px;font-weight:600;margin-top:4px}
.mh{display:block;font-size:12px;color:var(--acc);margin-top:3px;font-weight:600;min-height:16px}
.preview{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.fld{margin-bottom:8px}
.fld>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:500}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}
.actions{display:flex;gap:8px;margin:14px -18px 0;position:sticky;bottom:0;z-index:3;background:var(--card);padding:10px 18px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.actions .sp{flex:1}
.actions button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 14px;font-weight:600}
.actions button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.rule{display:grid;grid-template-columns:1fr 78px 20px 60px 26px 30px;gap:4px;align-items:center;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.rule input{padding:6px}
.rule button{border:0;background:none;color:var(--over);font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
svg.spark{width:100%;height:64px;display:block}
.sparklab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 0 8px}
.sparklab b{color:var(--text)}
svg.chart{width:100%;height:auto;display:block}
.chart text{font-size:10.5px;fill:var(--muted);font-family:var(--font)}
.chart .cv{fill:var(--text);font-weight:600}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;border-top:0;font-size:12px}
.tbl tr[data-act]{cursor:pointer}
.tbl td.r,.tbl th.r{text-align:right}
.tbl small{color:var(--muted)}
.v-over{color:var(--over);font-weight:700}.v-soon{color:var(--soon);font-weight:700}
details.ref summary{cursor:pointer;font-weight:600;font-size:14px}
details.ref .tbl{margin-top:8px;font-size:12.5px}
.hike{border-top:1px solid var(--line);padding:13px 2px;cursor:pointer}.hike:first-child{border-top:0}

<div id="toast"></div>
<script>
'use strict';
/* ---------- 기본 데이터 ---------- */
const KEY='lifebook.v1';
const CAT_OUT=['식비','외식·카페','생활용품','주거·관리비','공과금','통신','구독·서비스','교통·차량','의료·건강','보험','부모님·가족','경조사','교육','문화·여가','의류·미용','용돈','저축·투자','세금','기타'];
const CAT_IN=['급여','연금','사업소득','이자·배당','용돈','환급','경조금','기타'];
const PAY=['카드','현금','계좌이체','간편결제','자동이체'];
// 일반적 권장 주기(차량·운행조건마다 다름 → 취급설명서 기준으로 수정)
const DEFAULT_RULES=[
  {item:'엔진오일',km:7000,months:6},{item:'오일필터',km:7000,months:6},
  {item:'에어컨필터',km:10000,months:6},{item:'에어클리너',km:15000,months:12},
  {item:'타이어 위치교환',km:10000,months:12},{item:'브레이크패드',km:30000,months:24},
  {item:'와이퍼',km:0,months:12},{item:'냉각수',km:40000,months:24},
  {item:'브레이크오일',km:40000,months:24},{item:'배터리',km:0,months:36},
  {item:'미션오일',km:60000,months:48},{item:'점화플러그',km:60000,months:48},
  {item:'타이어 교체',km:50000,months:48}
];
const SCHED_CAT=['자동차','보험','건강','신분·면허','자격·교육','세금·공과','가족·기념일','기타'];
const SCHED_TITLES=['자동차보험 만기','자동차 정기검사','자동차 종합검사','자동차세(6월·12월)','주민세(8월)','건강보험료 정산','자동차세 연납','운전면허 적성검사·갱신','국가건강검진','암검진','여권 만료','실손보험 갱신','재산세 납부(7월)','재산세 납부(9월)','종합소득세 신고(5월)','자격증 보수교육','부모님 생신','결혼기념일','제사'];
const REPEAT=[['none','반복 없음'],['1m','매월'],['6m','6개월마다'],['1y','매년'],['2y','2년마다'],['5y','5년마다'],['10y','10년마다']];
const REPEAT_M={none:0,'1m':1,'6m':6,'1y':12,'2y':24,'5y':60,'10y':120};
const GIFT_KIND=['결혼','부고(조의)','돌·생일','회갑·칠순','개업·이전','병문안','출산','기타'];
const GIFT_REL=['가족·친척','친구','직장','이웃·지인','모임·동호회','기타'];

function blank(){return {tx:[],budget:0,car:{name:'',plate:'',odo:0,fuelType:'휘발유',year:''},rules:DEFAULT_RULES.map(r=>({...r})),maint:[],fuel:[],recur:[],sched:[],gift:[],health:[],hike:[],gym:[],lab:[],profile:{height:'',sex:''},care:[],careCfg:{name:'아버지',hospital:'',admit:'',members:[]},lock:null,recurAuto:'',accounts:[],moves:[],assetHist:{}};}
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}dailyBackup();cloud.push();}
// 자동 보관본: 이 기기 브라우저에 날짜별로 최근 7개 (실수로 지워지거나 동기화로 덮어써져도 되살릴 수 있게)
function backupList(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(KEY+'.bk.'))out.push(k);}}catch(e){}return out.sort().reverse();}
function backupLocal(label){
  try{const k=KEY+'.bk.'+new Date().toISOString().replace(/[:.]/g,'-');localStorage.setItem(k,JSON.stringify({label,at:new Date().toISOString(),data:S}));
    const all=backupList();all.slice(10).forEach(x=>localStorage.removeItem(x));}catch(e){}
}
let lastBk='';
function dailyBackup(){const t=today();if(lastBk===t)return;try{if(backupList().some(k=>k.startsWith(KEY+'.bk.'+t)))return lastBk=t;}catch(e){}
  if(S.tx.length||S.accounts.length||S.care.length){backupLocal('하루 자동 보관');lastBk=t;}}
/* ---------- 클라우드 동기화 (claude.ai 아티팩트로 열었을 때) ----------
   본인 전용 경로 data/users/<id>/ 에 저장 → 같은 계정이면 휴대폰·PC 어디서나 같은 기록,
   다른 사람은 볼 수 없음. 가계부는 연도별 문서로 나눠 문서 크기 제한을 피함. */
const cloud={db:null,base:null,sent:{},timer:null,busy:false,again:false,
  docs(){
    const out={meta:{budget:S.budget,car:S.car,rules:S.rules,profile:S.profile,careCfg:S.careCfg,lock:S.lock,recurAuto:S.recurAuto,assetHist:S.assetHist}};
    for(const k of ['maint','fuel','recur','sched','gift','health','hike','gym','lab','care','accounts','moves'])out[k]={items:S[k]};
    const years={};S.tx.forEach(t=>{(years[t.date.slice(0,4)]||=[]).push(t);});
    for(const y in years)out['tx-'+y]={items:years[y]};
    for(const id in this.sent)if(id.startsWith('tx-')&&!out[id])out[id]=null; // 비워진 연도는 삭제
    return out;
  },
  push(){if(!this.db)return;this.pending=true;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),400);},
  async flush(){
    if(this.busy){this.again=true;return;}
    this.busy=true;setSync('저장 중…');
    try{
      const docs=this.docs();
      for(const id in docs){
        const body=docs[id],js=body?JSON.stringify(body):null;
        if(this.sent[id]===js)continue;
        const ref=this.db.collection(this.base).doc(id);
        if(body)await ref.set(body);else await ref.delete();
        if(js)this.sent[id]=js;else delete this.sent[id];
      }
      setSync('☁ 동기화됨');
    }catch(e){setSync('⚠ 저장 실패');toast(e&&e.code==='quota_exceeded'?'저장공간이 가득 찼습니다. 오래된 기록을 정리하세요':'서버 저장에 실패했습니다. 잠시 후 다시 시도됩니다');setTimeout(()=>this.push(),5000);}
    this.busy=false;if(this.again){this.again=false;this.flush();}else this.pending=false;
  },
  apply(snap){
    if(snap.metadata.hasPendingWrites||this.busy||this.pending)return;
    const got={};snap.docs.forEach(d=>{got[d.id]=d.data();});
    // 서버 내용으로 바꾸기 전에, 이 기기에만 있던 기록이 사라지는지 확인해 보관
    const COLS=['maint','fuel','recur','sched','gift','health','hike','gym','lab','care','accounts','moves'];
    const lost=COLS.filter(k=>(S[k]||[]).length&&!(got[k]&&(got[k].items||[]).length));
    if(lost.length)backupLocal('동기화 전 자동 보관 ('+lost.join(',')+')');
    const n=blank();
    if(got.meta){n.budget=got.meta.budget||0;n.car={...n.car,...got.meta.car};if(Array.isArray(got.meta.rules))n.rules=got.meta.rules;if(got.meta.profile)n.profile={...n.profile,...got.meta.profile};if('lock' in got.meta)n.lock=got.meta.lock;if(got.meta.recurAuto)n.recurAuto=got.meta.recurAuto;if(got.meta.assetHist)n.assetHist=JSON.parse(JSON.stringify(got.meta.assetHist));if(got.meta.careCfg)n.careCfg={...n.careCfg,...got.meta.careCfg};}
    let keep=false;
    for(const k of COLS){
      if(got[k])n[k]=JSON.parse(JSON.stringify(got[k].items||[]));
      else if((S[k]||[]).length){n[k]=S[k];keep=true;} // 서버에 한 번도 올라간 적 없는 묶음 → 이 기기 것 유지 후 올림
    }
    const hasTx=Object.keys(got).some(id=>id.startsWith('tx-'));
    for(const id in got)if(id.startsWith('tx-'))n.tx.push(...JSON.parse(JSON.stringify(got[id].items||[])));
    if(!hasTx&&S.tx.length){n.tx=S.tx;keep=true;}
    if(!got.meta){['budget','car','rules','profile','careCfg','lock','recurAuto','assetHist'].forEach(k=>{n[k]=S[k];});keep=true;}
    this.sent={};for(const id in got)this.sent[id]=JSON.stringify(got[id]);
    S=n;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(autoPost()||keep)this.push();
    if(!dlg.open)render();
  },
  async refresh(){
    if(!this.db||this.pending||this.busy)return;
    try{const snap=await this.db.collection(this.base).get();if(!snap.empty)this.apply(snap);}catch(e){}
  },
  async start(){
    if(!window.claude?.use)return setSync('이 기기에만 저장');
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id)return setSync('이 기기에만 저장');
    this.base='data/users/'+id;
    let first;
    try{first=await db.collection(this.base).get();}catch(e){return setSync('이 기기에만 저장');}
    this.db=db;
    if(first.empty){ // 처음: 이 기기에 있던 기록을 올림
      if(S.tx.length||S.maint.length||S.fuel.length||S.recur.length||S.sched.length||S.gift.length||S.health.length||S.hike.length||S.gym.length||S.lab.length||S.care.length||S.accounts.length||S.car.name)await this.flush();
      else setSync('☁ 동기화됨');
    }else{this.apply(first);setSync('☁ 동기화됨');}
    db.collection(this.base).onSnapshot(s=>this.apply(s),()=>setSync('⚠ 연결 끊김'));
  }
};
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t;}

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(Number(n)||0).toLocaleString('ko-KR');
const won=n=>num(n)+'원';
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>fmtD(new Date());
function parseD(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);}
function addMonths(s,m){const d=parseD(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmtD(d);}
const dday=s=>Math.round((parseD(s)-parseD(today()))/864e5);
const ddayLabel=n=>n===0?'D-Day':n>0?'D-'+n:'D+'+(-n);
const ymLabel=ym=>{const [y,m]=ym.split('-');return `${y}년 ${Number(m)}월`;};
function shiftYM(ym,n){return addMonths(ym+'-01',n).slice(0,7);}
const WD=['일','월','화','수','목','금','토'];
const dLabel=s=>{const d=parseD(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}
function askConfirm(msg,yes){
  return new Promise(res=>{const d=$('#cfm');$('#cfmMsg').textContent=msg;$('#cfmYes').textContent=yes||'확인';
    $('#cfmNo').onclick=()=>{d.close();res(false);};$('#cfmForm').onsubmit=e=>{e.preventDefault();d.close();res(true);};d.oncancel=()=>res(false);d.showModal();});
}
function addTx(o){S.tx.push({id:uid(),ts:Date.now(),pay:'',memo:'',...o});}
/* 원본 기록과 가계부 기록 연결: 원본을 고치면 가계부도 고쳐지고, 원본을 지우면 가계부 기록도 지워진다.
   가계부 기록에 src='종류:원본id'를 남기고, 예전 기록(연결 표시 없음)은 날짜·금액·내용 앞부분으로 찾는다. */
const LINK={
  maint:r=>+r.cost>0?{type:'out',date:r.date,amount:+r.cost,cat:'교통·차량',memo:`[정비] ${r.item}${r.shop?' - '+r.shop:''}`}:null,
  fuel:r=>+r.amount>0?{type:'out',date:r.date,amount:+r.amount,cat:'교통·차량',memo:`[주유] ${r.station||''} ${r.liters?r.liters+'L':''}`.trim()}:null,
  gift:r=>+r.amount>0?(r.dir==='give'?{type:'out',date:r.date,amount:+r.amount,cat:'경조사',memo:`[${r.kind}] ${r.person}`}:{type:'in',date:r.date,amount:+r.amount,cat:'경조금',memo:`[${r.kind}] ${r.person}`}):null,
  hike:r=>+r.cost>0?{type:'out',date:r.date,amount:+r.cost,cat:'문화·여가',memo:`[등산] ${r.mountain}`}:null,
  care:r=>r.who!==SELF&&r.type==='out'&&+r.amount>0?{type:'out',date:r.date,amount:+r.amount,cat:'부모님·가족',memo:`[${careName()} ${r.cat}] ${r.memo||''}`.trim()}:null
};
const LINK_PREFIX={maint:()=>'[정비]',fuel:()=>'[주유]',gift:r=>`[${r.kind}] ${r.person}`,hike:()=>'[등산]',care:()=>`[${careName()}`};
function linkedTx(coll,r){
  const key=coll+':'+r.id;
  let t=S.tx.find(x=>x.src===key);
  if(!t&&coll==='care')t=S.tx.find(x=>x.id===r.id+'-m');
  if(!t){const pre=LINK_PREFIX[coll](r),amt=coll==='maint'||coll==='hike'?+r.cost:+r.amount;
    t=S.tx.find(x=>!x.src&&x.date===r.date&&+x.amount===amt&&String(x.memo||'').startsWith(pre));}
  return t;
}
function linkNew(coll,r,on){const w=LINK[coll](r);if(on&&w)addTx({...w,src:coll+':'+r.id,...(coll==='care'?{acct:mainAcct()}:{})});}
function removeLinked(coll,r){const t=linkedTx(coll,r);if(t){S.tx=S.tx.filter(x=>x!==t);return 1;}return 0;}
function updateLinked(coll,old,r){
  const t=linkedTx(coll,old);if(!t)return;
  const w=LINK[coll](r);
  if(!w)S.tx=S.tx.filter(x=>x!==t);else Object.assign(t,w,{src:coll+':'+r.id});
}
// 원본이 이미 지워졌는데 남아 있는 가계부 기록(예전 버전에서 생긴 것)
function orphanTx(){
  return S.tx.filter(t=>{
    const m=String(t.memo||'');
    if(t.src){const [c,id]=t.src.split(':');return S[c]&&!S[c].some(x=>x.id===id);}
    if(m.startsWith('[정비]'))return !S.maint.some(x=>x.date===t.date&&+x.cost===+t.amount);
    if(m.startsWith('[주유]'))return !S.fuel.some(x=>x.date===t.date&&+x.amount===+t.amount);
    if(m.startsWith('[등산]'))return !S.hike.some(x=>x.date===t.date&&+x.cost===+t.amount);
    return false;
  });
}

};
const short=v=>v>=100000?Math.round(v/10000)+'만':v>=10000?(v/10000).toFixed(1).replace(/\.0$/,'')+'만':num(v);
function barChart(data,fmt=short){
  const W=320,H=150,top=20,bot=22,max=Math.max(...data.map(d=>d.value),1),bw=W/data.length;
  const bars=data.map((d,i)=>{const h=Math.max((H-top-bot)*d.value/max,d.value?2:0),x=i*bw+bw*.2,w=bw*.6,y=H-bot-h,cx=(x+w/2).toFixed(1);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="var(--acc)" opacity="${d.hi?1:.38}"/>`+
      (d.value?`<text x="${cx}" y="${(y-6).toFixed(1)}" text-anchor="middle" class="cv">${fmt(d.value)}</text>`:'')+
      `<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(d.label)}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="막대 그래프"><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>${bars}</svg>`;
}
function spark(vals,color='var(--acc)',unit=''){
  if(vals.length<2)return '';
  const W=320,H=64,p=6,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[p+i*(W-2*p)/(vals.length-1),p+(H-2*p)*(1-(v-mn)/rg)]);
  const line=pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${pts[0][0]},${H} L${line.replace(/ /g,' L')} L${pts.at(-1)[0]},${H} Z" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="sparklab"><span>최저 ${mn}${unit}</span><span>최근 <b>${vals.at(-1)}${unit}</b></span><span>최고 ${mx}${unit}</span></div>`;
}
function weekStart(s){const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d);}

const dlg=$('#dlg'),dlgForm=$('#dlgForm');
function optHTML(opts,val){return opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`;}).join('');}
function fieldHTML(fd,val){
  if(val===undefined||val===null)val=typeof fd.def==='function'?fd.def():(fd.def??'');
  const id='f_'+fd.k,req=fd.req?' required':'';
  if(fd.type==='checkbox')return `<div class="fld chk" data-k="${fd.k}"><label><input type="checkbox" name="${fd.k}"${val?' checked':''}> ${esc(fd.label)}</label></div>`;
  let input;
  if(fd.type==='select')input=`<select id="${id}" name="${fd.k}"${req}>${fd.dep||fd.deps?'':optHTML(typeof fd.options==='function'?fd.options():fd.options,val)}</select>`;
  else if(fd.type==='textarea')input=`<textarea id="${id}" name="${fd.k}">${esc(val)}</textarea>`;
  else{
    const extra=fd.type==='number'?` inputmode="${fd.dec?'decimal':'numeric'}" step="${fd.dec?'any':'1'}" min="0"`:'';
    const list=fd.list?` list="${id}_l"`:'';
    input=`<input id="${id}" name="${fd.k}" type="${fd.type||'text'}" value="${esc(val)}"${extra}${list}${req} placeholder="${esc(fd.ph||'')}" autocomplete="off"${fd.attrs||''}>`+
      (fd.list?`<datalist id="${id}_l">${(typeof fd.list==='function'?fd.list():fd.list).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'');
  }
  return `<div class="fld" data-k="${fd.k}"><label for="${id}">${esc(fd.label)}${fd.req?' *':''}</label>${input}</div>`;
}
const korWon=n=>{n=Math.round(+n||0);const neg=n<0;n=Math.abs(n);const eok=Math.floor(n/1e8),man=Math.floor(n%1e8/1e4),rest=n%1e4;
  return (neg?'-':'')+[eok?num(eok)+'억':'',man?num(man)+'만':'',rest?num(rest):''].filter(Boolean).join(' ')+'원';};

const prefKey=(title,k)=>KEY+'.pref.'+String(title).replace(/\s*(추가|수정)$/,'').replace(/\d+월분/,'')+'.'+k;
function openForm(title,fields,rec,onSave,onDelete){
  const opts=fields.filter(fd=>fd.type==='checkbox'&&fd.k.startsWith('_'));
  if(opts.length){rec=rec?{...rec}:{};opts.forEach(fd=>{if(rec[fd.k]===undefined){try{const pv=localStorage.getItem(prefKey(title,fd.k));if(pv!==null)rec[fd.k]=pv==='1';}catch(e){}}});}
  dlgForm.innerHTML=`<h2>${esc(title)}</h2>`+fields.map(fd=>fieldHTML(fd,rec?rec[fd.k]:undefined)).join('')+
    `<div class="actions">${onDelete?'<button type="button" class="danger" data-x="del">삭제</button>':''}<span class="sp"></span><button type="button" data-x="cancel">취소</button>${!onDelete&&/추가$/.test(title)?'<button type="button" data-more="1">저장 후 계속</button>':''}<button type="submit" class="primary">저장</button></div>`;
  const shown=fields.filter(fd=>fd.show);
  [...new Set(shown.map(fd=>fd.showBy||'kind'))].forEach(by=>{const ctl=dlgForm.elements.namedItem(by);if(!ctl)return;
    const upd=()=>shown.filter(fd=>(fd.showBy||'kind')===by).forEach(fd=>{dlgForm.querySelector(`.fld[data-k="${fd.k}"]`).hidden=!fd.show.includes(ctl.value);});
    ctl.addEventListener('change',upd);upd();});
  fields.filter(fd=>fd.deps).forEach(fd=>{
    const el=dlgForm.elements.namedItem(fd.k),vals=()=>Object.fromEntries(fd.deps.map(k=>[k,dlgForm.elements.namedItem(k).value]));
    const fill=keep=>{const cur=keep??el.value;el.innerHTML=optHTML(fd.opts(vals()),cur);};
    fd.deps.forEach(k=>dlgForm.elements.namedItem(k).addEventListener('change',()=>fill()));fill(rec&&rec[fd.k]!=null?rec[fd.k]:undefined);
  });
  fields.filter(fd=>fd.dep).forEach(fd=>{
    const el=dlgForm.elements.namedItem(fd.k),dep=dlgForm.elements.namedItem(fd.dep);
    const fill=keep=>{const cur=keep??el.value;el.innerHTML=optHTML(fd.map[dep.value]||[],cur);};
    dep.addEventListener('change',()=>fill());fill(rec&&rec[fd.k]!=null?rec[fd.k]:(typeof fd.def==='function'?fd.def():fd.def));
  });
  dlgForm.querySelector('[data-x=cancel]').onclick=()=>dlg.close();
  let more=false;const mb=dlgForm.querySelector('[data-more]');if(mb)mb.onclick=()=>{more=true;dlgForm.requestSubmit();};
  const del=dlgForm.querySelector('[data-x=del]');
  if(del)del.onclick=async()=>{if(await askConfirm('이 기록을 삭제할까요?','삭제')){onDelete();save();dlg.close();render();toast('삭제했습니다');}};
  dlgForm.onsubmit=async e=>{
    e.preventDefault();
    dlgForm.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));dlgForm.querySelectorAll('.errmsg').forEach(x=>x.remove());
    if(!dlgForm.checkValidity()){more=false;
      const bad=dlgForm.querySelector(':invalid:not(fieldset)');
      if(bad){bad.classList.add('bad');(bad.closest('.fld')||bad.parentNode).insertAdjacentHTML('beforeend',`<div class="errmsg">${bad.value===''?'이 칸을 채워 주세요':'숫자를 다시 확인해 주세요'}</div>`);bad.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>bad.focus({preventScroll:true}),300);}
      toast('빨갛게 표시된 칸을 확인해 주세요');return;}
    const v={};
    for(const fd of fields){
      const el=dlgForm.elements.namedItem(fd.k);
      if(fd.type==='checkbox'){v[fd.k]=el.checked;if(fd.k.startsWith('_'))try{localStorage.setItem(prefKey(title,fd.k),el.checked?'1':'0');}catch(e){}}
      else if(fd.type==='number')v[fd.k]=el.value===''?null:Number(el.value);
      else v[fd.k]=el.value.trim();
    }
    if(await onSave(v)===false){more=false;return;}
    save();dlg.close();render();
    if(more){
      // 같은 날짜·분류로 다음 기록을 바로 입력
      const keep={};['owner','type','date','kind','cat','who','pay','acct','sido','dir'].forEach(k=>{if(k in v)keep[k]=v[k];});
      openForm(title,fields,keep,onSave,null);toast('저장했습니다 · 다음 기록을 입력하세요');
    }else toast('저장했습니다');
  };
  showDlg();
  const first=dlgForm.querySelector('input:not([type=checkbox]),select,textarea');
  if(first&&matchMedia('(pointer:fine)').matches)first.focus();
}

function odoRecords(){return [...S.fuel.map(f=>({km:+f.odo||0,date:f.date,ts:f.ts||0,what:'주유',id:f.id,k:'fuel'})),...S.maint.map(m=>({km:+m.km||0,date:m.date,ts:m.ts||0,what:'정비 '+m.item,id:m.id,k:'maint'}))].filter(r=>r.km>0);}
function currentOdo(){
  const since=S.car.odoDate||'',at=S.car.odoAt||0;
  const later=odoRecords().filter(r=>!since||r.date>since||(r.date===since&&r.ts>at));
  return Math.max(+S.car.odo||0,...later.map(r=>r.km));
}
// 주행거리를 직접 고칠 때: 더 큰 값이 적힌 기록이 있으면 알려 주고(오타 찾기), 그래도 이 값으로 저장
// 정비 km가 현재 주행거리보다 훨씬 크면 오타인지 한 번 묻기
async function maintKmCheck(km){
  const odo=currentOdo();
  if(km&&odo&&km>odo+5000)return await askConfirm(`정비 주행거리 ${num(km)}km가 현재 주행거리 ${num(odo)}km보다 많이 큽니다. 0을 더 넣지 않았는지 확인해 주세요.\n그대로 저장할까요?`,'그대로 저장');
  return true;
}
async function setOdoValue(v){
  const big=odoRecords().filter(r=>r.km>v).sort((a,b)=>b.km-a.km)[0];
  if(big&&!await askConfirm(`기록 중에 더 큰 주행거리가 있습니다.\n${big.date} ${big.what}: ${num(big.km)}km\n\n오타라면 자동차 화면의 정비·주유 이력에서 그 기록을 눌러 고쳐 주세요.\n지금 입력한 ${num(v)}km로 저장할까요?`,'이 값으로 저장'))return false;
  S.car.odo=v;S.car.odoDate=today();S.car.odoAt=Date.now();return true;
}
function maintStatus(rule){
  const nm=x=>String(x||'').replace(/\s/g,'');
  const recs=S.maint.filter(m=>nm(m.item)===nm(rule.item)||nm(m.item).includes(nm(rule.item))).sort((a,b)=>b.date.localeCompare(a.date)||(b.km||0)-(a.km||0));
  const last=recs[0];
  if(!last)return {rule,level:'none',label:'기록없음'};
  const odo=currentOdo();
  if(last.km!=null&&+last.km>odo+1000)return {rule,last,level:'soon',label:'km 확인',badKm:true,odo};
  const nextKm=rule.km>0&&last.km!=null?last.km+rule.km:null;
  const nextDate=rule.months>0?addMonths(last.date,rule.months):null;
  const remKm=nextKm!=null?nextKm-odo:null,days=nextDate?dday(nextDate):null;
  let level='ok';
  if((remKm!=null&&remKm<=0)||(days!=null&&days<0))level='over';
  else if((remKm!=null&&remKm<=1000)||(days!=null&&days<=30))level='soon';
  return {rule,last,nextKm,nextDate,remKm,days,level,label:{over:'교체필요',soon:'임박',ok:'양호'}[level]};
}
function fuelStats(){
  const arr=[...S.fuel].sort((a,b)=>(a.odo||0)-(b.odo||0));
  let lastFull=null,acc=0;const eff={};
  for(const f of arr){
    acc+=+f.liters||0;
    if(f.full){if(lastFull!=null&&f.odo>lastFull&&acc>0)eff[f.id]=(f.odo-lastFull)/acc;lastFull=f.odo;acc=0;}
  }
  const vals=Object.values(eff);
  return {eff,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
}

function recurDue(r){
  const t=today(),d=parseD(t);
  const make=(y,m)=>{const last=new Date(y,m+1,0).getDate();return fmtD(new Date(y,m,Math.min(Math.max(1,r.day||1),last)));};
  let due=make(d.getFullYear(),d.getMonth());
  if(due<t){const n=new Date(d.getFullYear(),d.getMonth()+1,1);due=make(n.getFullYear(),n.getMonth());}
  return due;
}

function moveToMe(){
  const theirs=S.recur.filter(r=>ownerOf(r)==='parent'),pn=careName();
  dlgForm.innerHTML=`<h2>내 고정비로 옮기기</h2>
   <p class="hint">${esc(pn)} 고정비 중 내가 내는 것으로 바꿀 항목을 고르세요. 옮기면 ${esc(pn)} 고정비에서는 빠집니다.</p>
   <ul class="list" id="mvList">${theirs.map(r=>`<li class="row" style="cursor:default"><label style="display:flex;gap:10px;align-items:center;flex:1;min-width:0"><input type="checkbox" value="${r.id}"><span class="grow"><b>${esc(r.name)}</b><small>${esc(r.cat)} · ${esc(whoLabel(r.from||SELF))} · 매월 ${r.day}일</small></span><span class="amt">${num(r.amount)}</span></label></li>`).join('')}</ul>
   <div class="fld" style="margin-top:12px"><label for="mvPay">결제수단</label><select id="mvPay">${optHTML(PAY,'자동이체')}</select></div>
   <label class="fld chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mvTx" checked> 이미 ${esc(pn)} 장부에 기록된 같은 고정비도 내 가계부로 옮기기</label>
   <div class="actions"><span class="sp"></span><button type="button" data-x="cancel">취소</button><button type="submit" class="primary">옮기기</button></div>`;
  dlgForm.querySelector('[data-x=cancel]').onclick=()=>dlg.close();
  dlgForm.onsubmit=e=>{e.preventDefault();
    const ids=[...dlgForm.querySelectorAll('#mvList input:checked')].map(i=>i.value);
    if(!ids.length){toast('옮길 항목을 고르세요');return;}
    const pay=dlgForm.querySelector('#mvPay').value,moveTx=dlgForm.querySelector('#mvTx').checked,used=new Set();
    let moved=0,dup=0,txMoved=0;
    for(const id of ids){
      const r=find('recur',id);if(!r)continue;
      const cat=myCatOf(r.cat,r.name),oldFrom=r.from||SELF;
      const twin=S.recur.find(x=>x!==r&&ownerOf(x)==='me'&&x.name===r.name&&+x.amount===+r.amount);
      if(twin){S.recur=S.recur.filter(x=>x!==r);dup++;}
      else{Object.assign(r,{owner:'me',cat,pay});delete r.from;moved++;}
      if(moveTx){
        S.care.filter(c=>c.type==='out'&&c.memo===`[고정] ${r.name}`&&+c.amount===+r.amount&&!used.has(c)).forEach(c=>{used.add(c);
          // 내가 대신 내서 내 가계부에 '부모님·가족'으로 이미 있던 기록은 원래 분류로 되돌리고, 없으면 새로 만듦
          const mirror=c.who!==SELF&&S.tx.find(t=>t.memo===`[${pn} 고정] ${r.name}`&&t.date===c.date&&+t.amount===+c.amount&&!used.has(t));
          if(mirror){used.add(mirror);Object.assign(mirror,{cat,pay,memo:`[고정] ${r.name}`});}
          else addTx({type:'out',date:c.date,amount:c.amount,cat,pay,memo:`[고정] ${r.name}`});
          S.care=S.care.filter(x=>x!==c);txMoved++;
        });
      }
    }
    save();dlg.close();render();
    toast(`${moved+dup}건을 내 고정비로 옮겼습니다${dup?` (중복 ${dup}건 정리)`:''}${txMoved?` · 기록 ${txMoved}건 이동`:''}`);
  };
  showDlg();
}
/* ---------- 고정지출 자동 기록 ----------
   납부일이 지나면 그 달 기록을 자동으로 만든다(내 것 → 내 가계부, 아버지 것 → 아버지 장부).
   자동 기록은 이 기능을 처음 켠 날(recurAuto) 또는 항목을 등록한 날(since) 이후 납부일만 대상.
   그 전에 놓친 달은 '빠진 고정비'로 보여 주고 한 번에 기록할 수 있게 한다.
   기록 id를 '달+항목'으로 고정해 휴대폰·PC가 동시에 돌아도 한 번만 생긴다. */
const payday=(r,ym)=>{const last=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();return `${ym}-${String(Math.min(Math.max(1,+r.day||1),last)).padStart(2,'0')}`;};
function recurPostOne(r,ym){
  if(posted(r,ym))return false;
  const date=payday(r,ym),id=`rc-${ym}-${r.id}`,chk=r.variable?{check:true}:{};
  if(ownerOf(r)==='me'){if(!S.tx.some(t=>t.id===id))S.tx.push({id,ts:Date.now(),type:'out',date,amount:r.amount,cat:r.cat,pay:r.pay||'',acct:r.acct||'',memo:`[고정] ${r.name}`,...chk});}
  else{
    const who=(r.from||SELF)===SELF?SELF:ME;
    if(!S.care.some(c=>c.id===id))S.care.push({id,ts:Date.now(),type:'out',date,amount:r.amount,cat:CARE_OUT.includes(r.cat)?r.cat:'집 관리비·공과금',who,memo:`[고정] ${r.name}`,tax:['병원비(월 정산)','장기요양(주간보호·방문요양)','약제비','외래·검사'].includes(r.cat),...chk});
    // 내가 대신 낸 부모님 고정비는 내 가계부에도 '부모님·가족' 지출로
    if(who===ME&&!S.tx.some(t=>t.id===id+'-m'))S.tx.push({id:id+'-m',ts:Date.now(),type:'out',date,amount:r.amount,cat:'부모님·가족',pay:'',acct:mainAcct(),memo:`[${careName()} 고정] ${r.name}`,...chk});
  }
  r.posted=[...(r.posted||[]),ym].slice(-36);return true;
}
function postRecurAuto(){
  const t=today();
  if(!S.recurAuto){S.recurAuto=t;return true;}
  let ch=false;
  for(const r of S.recur){
    // 요양병원비는 영수증 보고 입력하는 방식이 기본
    if(r.manual===undefined&&/요양병원/.test(r.name)){r.manual=true;ch=true;}
    if(!r.active||r.manual)continue;
    const start=[S.recurAuto,r.since||''].sort().pop();
    for(let ym=start.slice(0,7),g=0;ym<=t.slice(0,7)&&g<36;ym=shiftYM(ym,1),g++){const d=payday(r,ym);if(d>=start&&d<=t&&recurPostOne(r,ym))ch=true;}
  }
  return ch;
}
// 영수증 입력 대기: 이번 달은 납부일 3일 전부터, 지난달은 등록 이후 것 중 아직 입력 안 한 것
function receiptDue(){
  const t=today(),ym=t.slice(0,7),res=[];
  for(const r of S.recur.filter(x=>x.active&&x.manual))
    for(const m of [shiftYM(ym,-1),ym]){
      const d=payday(r,m);if(posted(r,m))continue;
      if(m===ym?dday(d)>3:(!r.since||d<r.since))continue;
      res.push({r,ym:m,date:d});
    }
  return res;
}
// 자동 기록 시작 전에 납부일이 지났는데 기록 안 된 것 (지난달·이번 달)
function missingRecur(o){
  const t=today(),res=[];
  for(const r of S.recur.filter(x=>x.active&&!x.manual&&(!o||ownerOf(x)===o)))
    for(const ym of [shiftYM(t.slice(0,7),-1),t.slice(0,7)]){const d=payday(r,ym);if(d<=t&&!posted(r,ym)&&!(r.since&&d<r.since))res.push({r,ym});}
  return res;
}
/* ---------- 내 재산 ----------
   계좌마다 '확인한 잔액 + 확인일'을 적어 두고, 그 뒤에 가계부(그 통장 지정)·계좌 간 이동 기록으로 움직인 돈을 더하고 뺀다.
   통장 앱을 볼 때마다 '잔액 업데이트'를 하면 확인일이 새로 잡혀 오차가 0이 된다.
   증권 계좌 = 예수금 + 종목(수량×현재가). 대출은 빚으로 따로 빼서 순자산 = 자산 − 빚. 부모님 자금은 내 재산에 넣지 않는다. */
const ACCT_TYPES=[['bank','입출금 통장'],['saving','적금·자유적금'],['deposit','예금'],['stock','증권 계좌'],['cash','현금'],['realty','부동산'],['etc','기타 자산 (보증금·해약환급금·자동차 등)'],['loan','대출·빚']];
const ACCT_COLOR={bank:'var(--c-assets)',saving:'var(--c-hike)',deposit:'var(--c-car)',stock:'var(--c-gym)',cash:'var(--c-sched)',realty:'var(--c-care)',etc:'var(--c-recur)',loan:'var(--c-health)'};

const acctById=id=>S.accounts.find(a=>a.id===id);

// 아버지 돈이 실제로 드나드는 내 통장: 지정한 통장, 없으면 가계부 기본 통장 (아버지 명의 통장에 따로 있으면 없음)
function fundAcct(){const f=fundCfg();if(f.inMine===false)return '';return f.acct&&acctById(f.acct)?f.acct:mainAcct();}
// 통장 잔액을 확인한 뒤 입력한 수입·지출이 얼마나 반영됐는지
function flowSummary(){
  let inc=0,out=0,n=0;const fa=fundAcct();
  for(const a of S.accounts){if(a.type==='loan')continue;const af=a.asOf||'',ck=a.checkedAt||0,after=r=>r.date>af||(r.date===af&&(r.ts||0)>ck);
    S.tx.forEach(t=>{if(t.acct===a.id&&after(t)){n++;if(t.type==='in')inc+=+t.amount||0;else out+=+t.amount||0;}});
    if(fa===a.id)S.care.forEach(c=>{if(c.who===SELF&&c.cat!=='잔액 조정'&&after(c)){n++;if(c.type==='in')inc+=+c.amount||0;else out+=+c.amount||0;}});}
  const unlinked=S.tx.filter(t=>!t.acct&&t.date>=today().slice(0,7)+'-01').length;
  return {inc,out,n,unlinked};
}
// 전체 관리 금액 = 내 순자산 + 아버지 돈
function grandTotal(){const t=assetTotals(),fs=fundStats(),fb=fs?fs.bal:0;return {...t,father:fb,total:t.net+fb};}
function acctFlow(a){
  // 확인일 다음 날부터의 기록 + 확인일 당일이라도 잔액을 확인한 뒤에 입력한 기록
  let f=0;const af=a.asOf||'',ck=a.checkedAt||0,after=r=>r.date>af||(r.date===af&&(r.ts||0)>ck);
  S.tx.forEach(t=>{if(t.acct===a.id&&after(t))f+=t.type==='in'?+t.amount||0:-(+t.amount||0);});
  S.moves.forEach(m=>{if(after(m)){if(m.to===a.id)f+=+m.amount||0;if(m.from===a.id)f-=+m.amount||0;}});
  // 아버지 돈을 보관한 통장: 아버지 돈으로 들어오고 나간 것도 이 통장 잔액에 반영
  if(fundAcct()===a.id)S.care.forEach(c=>{if(c.who===SELF&&c.cat!=='잔액 조정'&&after(c))f+=c.type==='in'?+c.amount||0:-(+c.amount||0);});
  return f;
}
const stockVal=a=>(a.holdings||[]).reduce((s,h)=>s+(+h.qty||0)*(+h.price||0),0);
const stockCost=a=>(a.holdings||[]).reduce((s,h)=>s+(+h.qty||0)*(+h.avg||0),0);
function acctValue(a){
  if(a.type==='loan')return Math.max(0,(+a.balance||0)-acctFlow(a)); // 대출 계좌로 보낸 돈 = 상환
  return (+a.balance||0)+acctFlow(a)+(a.type==='stock'?stockVal(a):0);
}
function assetTotals(){
  const by={};let assets=0,debt=0;
  for(const a of S.accounts){if(a.inTotal===false)continue;const v=acctValue(a);
    if(a.type==='loan')debt+=v;else{assets+=v;by[a.type]=(by[a.type]||0)+v;}}
  // 내 통장에 보관 중인 아버지 돈은 내 재산이 아니므로 순자산에서 뺀다
  const ff=fundCfg(),fs=ff.inMine!==false&&S.accounts.length?fundStats():null,held=fs?Math.max(0,fs.bal):0;
  return {assets,debt,held,net:assets-debt-held,by};

  S.assetHist[ym]=v;const keys=Object.keys(S.assetHist).sort();while(keys.length>36)delete S.assetHist[keys.shift()];
  return true;
}

   <div class="hero-sub">통장 등 합계 ${won(t.assets)}${t.held?` − 보관 중인 ${esc(careName())} 돈 ${won(t.held)}`:''}${t.debt?` − 빚 ${won(t.debt)}`:''}${diff!=null?` · 지난달보다 <b class="${diff<0?'neg':'pos'}">${diff>=0?'+':''}${num(diff)}원</b>`:''}</div>
   ${stackBar(t.by,t.assets)}</section>
  <div class="toolbar"><button class="btn primary" data-act="addAcct" style="flex:1;padding:12px;font-size:15px">＋ 재산 추가</button><button class="btn" data-act="addMove" style="padding:12px">계좌 간 이동</button></div>
  ${months.length>1?`<section class="card"><h2>순자산 추이</h2>${barChart(months.map(m=>({label:Number(m.slice(5))+'월',value:Math.max(0,(S.assetHist[m]||{t:t.net}).t),hi:m===cm})))}</section>`:''}
  ${ACCT_TYPES.map(([k,l])=>{const list=S.accounts.filter(a=>a.type===k);if(!list.length)return '';const sum=list.filter(a=>a.inTotal!==false).reduce((x,a)=>x+acctValue(a),0);
    return `<section class="card" style="--acc:${ACCT_COLOR[k]}"><h2>${l}<span class="sp"></span><b style="font-size:15px" class="${k==='loan'?'neg':''}">${k==='loan'?'-':''}${won(sum)}</b></h2>${list.map(acctRow).join('')}</section>`;}).join('')}
  <button class="btn" data-act="addAcct" style="width:100%;padding:12px;margin-bottom:12px;border-style:dashed">＋ 다른 재산 추가</button>
  ${S.moves.length?`<section class="card"><h2>최근 계좌 간 이동</h2><ul class="list">${S.moves.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(m=>`<li class="row" data-act="editMove" data-id="${m.id}"><div class="grow"><b>${esc(acctById(m.from)?.name||'?')} → ${esc(acctById(m.to)?.name||'?')}</b><small>${m.date}${m.memo?' · '+esc(m.memo):''}</small></div><span class="amt">${num(m.amount)}</span></li>`).join('')}</ul></section>`:''}
  ${fs?`<section class="card" style="--acc:var(--c-care)"><h2>관리 중인 돈 (내 재산 아님)</h2><div class="row" data-act="go" data-tab="care" style="border:0"><div class="grow"><b>${esc(careName())} 돈</b><small>${fundCfg().inMine!==false?`${esc(fundCfg().note||'내 통장·증권에 보관')} · 내 순자산에서 뺐습니다`:esc(fundCfg().note||'')+' · 내 재산과 별개'}</small></div><span class="amt">${num(fs.bal)}</span></div></section>`:''}
  <section class="card"><details class="ref"><summary>정확하게 맞추는 요령</summary><ul class="hint" style="padding-left:18px;margin:8px 0 0">
   <li><b>잔액 업데이트가 기준</b>입니다. 은행·증권 앱을 열었을 때 찍힌 금액을 넣으면 그날부터 다시 계산해 오차가 사라집니다. 한 달에 한 번이면 충분합니다.</li>
   <li>가계부에 기록할 때 <b>‘어느 통장’</b>을 고르면 그 통장 잔액이 바로 늘고 줄어듭니다. 카드로 쓴 돈은 통장에서 바로 빠지지 않으니 비워 두고, 카드대금이 빠진 뒤 잔액 업데이트를 하세요.</li>
   <li>적금 넣기·증권 계좌로 옮기기처럼 <b>내 계좌끼리 옮긴 돈</b>은 ‘계좌 간 이동’으로 기록하세요. 지출이 아니라서 가계부에는 안 들어가고, 순자산도 그대로입니다.</li>
   <li><b>증권 계좌</b>: 예수금(현금)과 보유 종목을 따로 적습니다. 주식을 사고팔면 <b>‘매수/매도’</b> 버튼으로 기록하세요. 예수금과 종목이 함께 바뀌고 판 종목은 실현손익이 남습니다. 증권 계좌에서 은행으로 돈을 빼면 ‘계좌 간 이동’(증권 → 통장), 배당금은 가계부 수입(어느 통장: 증권 계좌)으로 기록합니다.</li>
   <li>주식은 <b>현재가를 직접 업데이트</b>해야 평가금액이 바뀝니다(자동 시세 연결 없음). 대용금은 주식 담보 가치라 따로 더하지 않습니다. 평가손익은 수량×(현재가−매입가)라서, 매도 수수료·세금을 미리 빼서 보여주는 증권사 화면과 몇만 원 다를 수 있습니다.</li>
  </ul></details></section>`;
}
/* 매수·매도: 예수금과 보유 종목을 한 번에 고친다.
   매수 = 예수금 −(수량×단가+수수료), 종목 수량↑·평균단가 다시 계산
   매도 = 예수금 +(수량×단가−수수료·세금), 종목 수량↓, 실현손익 = (단가−평균단가)×수량 − 수수료·세금
   직전 상태를 함께 저장해 마지막 거래는 ‘취소’로 되돌릴 수 있다. */
function tradeDialog(a,side){
  a.holdings=a.holdings||[];const hs=a.holdings,buy=side==='buy',cash=(+a.balance||0)+acctFlow(a);
  if(!buy&&!hs.length){toast('팔 종목이 없습니다');return;}
  openForm(`${a.name} ${buy?'매수':'매도'}`,[
    {k:'date',label:'체결일',type:'date',def:today,req:1},
    buy?{k:'name',label:'종목명',type:'text',req:1,list:hs.map(h=>h.name),ph:'예: SK하이닉스'}:{k:'name',label:'종목',type:'select',options:hs.map(h=>[h.name,`${h.name} (${num(h.qty)}주 보유)`])},
    {k:'qty',label:'수량(주)',type:'number',dec:1,req:1},
    {k:'price',label:'체결 단가(원)',type:'number',req:1},
    {k:'fee',label:buy?'수수료(원, 모르면 비워 두기)':'수수료·세금(원, 체결내역 참고)',type:'number'}],null,v=>{
      const amt=Math.round(v.qty*v.price),fee=+v.fee||0;let realized=0;
      let h=hs.find(x=>x.name===v.name);
      const prev={qty:h?h.qty:0,avg:h?h.avg:0,price:h?h.price:0,bal:a.balance,existed:!!h};
      if(buy){
        if(amt+fee>cash){toast(`예수금(${won(cash)})이 부족합니다. 먼저 ‘예수금·현재가 맞추기’로 입금액을 반영하세요`);return false;}
        if(!h){h={name:v.name,qty:0,avg:0,price:v.price};hs.push(h);}
        h.avg=Math.round((h.qty*h.avg+amt+fee)/(h.qty+v.qty));h.qty=+(h.qty+v.qty).toFixed(4);h.price=v.price;
        a.balance=(+a.balance||0)-amt-fee;
      }else{
        if(v.qty>h.qty){toast(`보유 수량(${num(h.qty)}주)보다 많이 팔 수 없습니다`);return false;}
        realized=Math.round((v.price-h.avg)*v.qty-fee);
        h.qty=+(h.qty-v.qty).toFixed(4);h.price=v.price;
        a.balance=(+a.balance||0)+amt-fee;
      }
      a.holdings=a.holdings.filter(x=>x.qty>0);
      a.trades=[...(a.trades||[]),{id:uid(),date:v.date,side,name:v.name,qty:v.qty,price:v.price,fee,realized:buy?0:realized,prev}].slice(-200);
      setTimeout(()=>toast(buy?`매수 반영: 예수금 −${num(amt+fee)}원`:`매도 반영: 예수금 +${num(amt-fee)}원 · 실현손익 ${realized>=0?'+':''}${num(realized)}원`),0);
    });
  dlgForm.querySelector('.actions').insertAdjacentHTML('beforebegin',`<p class="hint">지금 예수금 <b>${won(cash)}</b>. 체결 금액만큼 예수금이 ${buy?'줄고 종목이 늘어납니다':'늘고 종목이 줄어듭니다'}. 증권사 결제는 이틀 뒤(D+2)라 그사이 증권 앱 ‘인출 가능금’과 잠깐 다를 수 있습니다.</p>`);
}
function undoTrade(a){
  const t=(a.trades||[]).at(-1);if(!t)return;
  askConfirm(`마지막 거래(${t.side==='buy'?'매수':'매도'} ${t.name} ${num(t.qty)}주)를 취소할까요? 예수금과 종목이 거래 전으로 돌아갑니다.`,'거래 취소').then(ok=>{
    if(!ok)return;
    const p=t.prev;a.balance=p.bal;
    let h=(a.holdings||[]).find(x=>x.name===t.name);
    if(!p.existed){a.holdings=(a.holdings||[]).filter(x=>x.name!==t.name);}
    else{if(!h){h={name:t.name};a.holdings=[...(a.holdings||[]),h];}Object.assign(h,{qty:p.qty,avg:p.avg,price:p.price});}
    a.trades=a.trades.slice(0,-1);save();render();toast('거래를 취소했습니다');
  });
}
function acctDialog(a,mode){

  // 종목 하나 = 카드 한 장 (휴대폰에서도 크게)

    <div class="he-grid"><label>수량<input class="hq" type="number" inputmode="decimal" min="0" step="any" value="${esc(h.qty??'')}"></label><label>매입가(평단)<input class="ha" type="number" inputmode="numeric" min="0" value="${esc(h.avg??'')}"></label><label>현재가<input class="hp" type="number" inputmode="numeric" min="0" value="${esc(h.price??'')}"></label></div>

   <div class="fld2" ${upd?'hidden':''}><div class="fld"><label for="an">이름</label><input id="an" value="${esc(a.name)}" placeholder="예: 키움 위탁종합"></div>
   <div class="fld"><label for="ai">기관</label><input id="ai" value="${esc(a.inst||'')}" placeholder="예: 농협, 키움증권"></div></div>

   <div class="fld"><label for="ad">잔액 확인일</label><input id="ad" type="date" value="${esc(upd?today():a.asOf||today())}"></div></div>
   <div id="hbox" ${a.type==='stock'?'':'hidden'}><p class="hint" style="margin:4px 0 8px;font-weight:600;color:var(--text)">보유 종목</p><div id="hrows">${(a.holdings||[]).map(hrow).join('')}</div><button type="button" class="btn sm" id="addH">＋ 종목 추가</button></div>
   <div ${upd?'hidden':''}><div class="fld" style="margin-top:10px"><label for="am">메모</label><input id="am" value="${esc(a.memo||'')}" placeholder="예: 끝자리 7637, 월급통장"></div>
   <label class="fld chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="amain"${a.main?' checked':''}> 가계부 기본 통장 (새 기록의 ‘어느 통장’ 기본값)</label>
   <label class="fld chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="atot"${a.inTotal!==false?' checked':''}> 내 재산 합계에 포함</label></div>
   <p class="hint" id="ahint"></p>
   <div class="actions">${!isNew&&!upd?'<button type="button" class="danger" data-x="del">삭제</button>':''}<span class="sp"></span><button type="button" data-x="cancel">취소</button>${isNew?'<button type="button" data-more="1">저장하고 하나 더</button>':''}<button type="submit" class="primary">저장</button></div>`;
  const $d=q=>dlgForm.querySelector(q),hrows=$d('#hrows');
  const PH={bank:['예: 농협 자립예탁금','예: 농협, 국민은행'],saving:['예: 농협 자유적금','예: 농협'],deposit:['예: 신협 정기예금','예: 신협'],stock:['예: 키움 위탁종합','예: 키움증권'],cash:['예: 지갑 현금, 비상금','예: 집 금고'],realty:['예: 아파트, 토지','시세 출처: 예) KB시세'],etc:['예: 전세보증금, 보험 해약환급금',''],loan:['예: 주택담보대출','예: 농협']};
  const sync=()=>{const ty=$d('#at').value;$d('#hbox').hidden=ty!=='stock';$d('#an').placeholder=PH[ty][0];$d('#ai').placeholder=PH[ty][1];
    $d('#abl').textContent=ty==='stock'?'예수금 — 현금(원)':ty==='loan'?'남은 빚(원)':'잔액(원)';
    $d('#ahint').innerHTML=upd?(ty==='stock'?'증권 앱 ‘예수금’ 화면의 <b>인출 가능금(D+2 예수금)</b>을 넣고, 종목은 ‘잔고’ 화면의 보유수량·현재가로 맞추세요. 평소 사고팔 때는 ‘매수/매도’ 버튼을 쓰면 이 화면을 열 필요가 없습니다.':'통장 앱에 지금 찍힌 금액을 넣으세요. 확인일부터 다시 계산합니다.'):ty==='stock'?'예수금은 증권 앱 ‘예수금’ 화면의 금액, 주식은 수량과 현재가로 계산합니다. 대용금은 넣지 마세요.':ty==='loan'?'대출은 순자산에서 빠집니다. 상환하면 ‘계좌 간 이동’으로 대출 계좌로 보내세요.':'';};

  const hsum=()=>hrows.querySelectorAll('.hold-edit').forEach(c=>{const q=+c.querySelector('.hq').value||0,a=+c.querySelector('.ha').value||0,pr=+c.querySelector('.hp').value||0,el=c.querySelector('.he-sum');
    el.textContent=q&&pr?`평가 ${num(Math.round(q*pr))}원${a?` · 손익 ${q*(pr-a)>=0?'+':''}${num(Math.round(q*(pr-a)))}원 (${((pr/a-1)*100).toFixed(1)}%)`:''}`:'';});
  hrows.addEventListener('input',hsum);setTimeout(hsum);
  $d('#addH').onclick=()=>{hrows.insertAdjacentHTML('beforeend',hrow({}));hrows.lastElementChild.querySelector('.hn').focus();};
  $d('[data-x=cancel]').onclick=()=>dlg.close();
  let more=false;const mb=$d('[data-more]');if(mb)mb.onclick=()=>{more=true;dlgForm.requestSubmit();};

  dlgForm.onsubmit=e=>{e.preventDefault();

}
function moveDialog(m){
  const isNew=!m,opts=S.accounts.map(a=>[a.id,a.name]);
  if(opts.length<2){toast('계좌를 2개 이상 등록하세요');return;}
  openForm(isNew?'계좌 간 이동 추가':'계좌 간 이동 수정',[
    {k:'date',label:'날짜',type:'date',def:today,req:1},
    {k:'from',label:'보낸 계좌',type:'select',options:opts,def:mainAcct()||opts[0][0]},
    {k:'to',label:'받은 계좌',type:'select',options:opts,def:(opts.find(o=>o[0]!==mainAcct())||opts[1])[0]},
    {k:'amount',label:'금액(원)',type:'number',req:1},

   <div class="actions"><span class="sp"></span><button type="button" data-x="cancel">나중에</button><button type="submit" class="primary">정리하기</button></div>`;

      if(i.checked){recurPostOne(m.r,m.ym);rec++;}else{m.r.posted=[...(m.r.posted||[]),m.ym].slice(-36);skip++;}});
    save();dlg.close();render();toast(`기록 ${rec}건 · 기록 안 함 ${skip}건으로 정리했습니다`);
  };
  showDlg();
}

function hikeMin(h){
  if(!h.start||!h.end)return null;
  const [a,b]=h.start.split(':').map(Number),[c,d]=h.end.split(':').map(Number);
  const m=c*60+d-(a*60+b);return m>0?m:null;
}
const hm=m=>m==null?'':m<60?`${m}분`:`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`;
// 운동시간 연동용: 시각 → 직접 입력한 분 → 거리로 추정(휴식 포함 평균 시속 2km) 순서
function hikeMinutes(h){
  if(+h.minutes>0)return {m:+h.minutes,est:false,src:'input'};
  const t=hikeMin(h);if(t)return {m:t,est:false,src:'span'};
  if(+h.distance>0)return {m:Math.round(h.distance/2*60),est:true};
  return {m:0,est:false};
}

  mi.closest('.fld').insertAdjacentHTML('beforeend','<small class="mh" id="hkspan"></small>');
  let auto=!mi.value;
  const upd=()=>{const m=hikeMin({start:st.value,end:en.value});const box=document.getElementById('hkspan');
    if(!m){box.textContent='';return;}
    if(auto||!mi.value){mi.value=m;auto=true;}
    box.textContent=`출발~하산 ${hm(m)}`+(+mi.value&&+mi.value!==m?` · 합계에는 입력한 산행시간 ${hm(+mi.value)}이 쓰입니다`:'');};
  mi.addEventListener('input',()=>{auto=false;upd();});st.addEventListener('input',upd);en.addEventListener('input',upd);st.addEventListener('change',upd);en.addEventListener('change',upd);upd();
}

/* ---------- 부모님 병원비 (가족 공동 정산) ----------

const CARE_OUT=['병원비(월 정산)','장기요양(주간보호·방문요양)','집 관리비·공과금','보험료·세금','통신비','간병비','약제비','외래·검사','기저귀·소모품','식대·간식','이송·교통','용돈·기타','잔액 조정'];
const CARE_IN=['기초연금','국민연금','연금·기초연금','본인부담상한제 환급','보험금(실손 등)','예금 이자','기타 수입','잔액 조정'];
const POOL='__pool',SELF='__self',ME='__me';
const careName=()=>S.careCfg.name||'부모님';

/* ---------- 부모님 자금: 보유금 + 매월 연금 입금 − 부모님 돈으로 낸 지출 ----------
   연금은 설정한 지급일이 지나면 자동으로 입금 기록(같은 달·같은 항목은 한 번만, 기기 여러 대여도 중복 없음) */
const fundCfg=()=>S.careCfg.fund||{start:0,startDate:'',incomes:[],skip:[],year:''};

const splitMemo=m=>{const i=String(m||'').indexOf(' ');return i<0?[m,'']:[m.slice(0,i),m.slice(i+1)];};

function pensionSurplus(){
  const inc=fundCfg().incomes||[],expect={};inc.forEach(r=>{if(+r.amount>0){const k=r.kind+'|'+(+r.amount);expect[k]=(expect[k]||0)+1;}});
  const groups={};
  S.care.forEach(c=>{if(c.type==='in'&&c.who===SELF&&PEN_CATS.includes(c.cat)){const k=c.date.slice(0,7)+'|'+c.cat+'|'+(+c.amount);(groups[k]=groups[k]||[]).push(c);}});
  const extra=[];
  for(const k in groups){const [ym,cat,amt]=k.split('|'),n=expect[cat+'|'+amt]||0;if(!n)continue;
    const g=groups[k].slice().sort((a,b)=>(b.auto?1:0)-(a.auto?1:0));  // 자동 기록을 먼저 남김
    if(g.length>n)extra.push(...g.slice(n));}
  return extra;
}
// 이미 생긴 중복 연금 기록 정리(같은 달·같은 사람·같은 종류는 하나만 남김)
function dedupePensions(){
  const seen=new Set(),before=S.care.length;
  S.care=S.care.filter(c=>{if(!(c.auto&&c.type==='in'))return true;const k=penKey(c.date.slice(0,7),...splitMemo(c.memo));if(seen.has(k))return false;seen.add(k);return true;});
  return S.care.length!==before;
}
function repairIncomes(){
  const f=S.careCfg.fund;if(!f||!f.startDate)return false;
  if((f.incomes||[]).some(r=>+r.amount>0))return false;
  const recs=S.care.filter(c=>c.type==='in'&&c.who===SELF&&PEN_CATS.includes(c.cat)).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length)return false;
  const ym=recs[0].date.slice(0,7),seen=new Set(),inc=[];
  recs.filter(c=>c.date.startsWith(ym)).forEach(c=>{const [w,k]=splitMemo(c.memo);const who=w||'아버지',kind=PEN_CATS.includes(k)?k:c.cat,key=who+kind;if(seen.has(key))return;seen.add(key);inc.push({id:uid(),who,kind,amount:+c.amount,day:+c.date.slice(8)||25});});
  if(!inc.length)return false;

}
function postPensions(){

  while(ym<=t.slice(0,7)&&guard++<600){
    for(const r of f.incomes){
      if(!(+r.amount>0))continue;
      const last=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate(),d=`${ym}-${String(Math.min(+r.day||25,last)).padStart(2,'0')}`;
      const id=`pen-${ym}-${r.id}`,key=penKey(ym,r.who,r.kind);
      if(d<f.startDate||(f.postFrom&&d<=f.postFrom)||d>t||(f.skip||[]).includes(id)||(f.skip||[]).includes(key)||S.care.some(c=>c.id===id||(c.auto&&c.type==='in'&&penKey(c.date.slice(0,7),...splitMemo(c.memo))===key)))continue;

      S.care.push({id,ts:Date.now(),auto:true,type:'in',date:d,amount:+r.amount,cat:r.kind,who:SELF,memo:`${r.who} ${r.kind}`,tax:false});changed=true;

}
function fundStats(){
  const f=fundCfg(),t=today();
  if(!f.startDate)return null;
  const after=S.care.filter(c=>c.date>=f.startDate&&c.date<=t);
  const delta=c=>c.who===SELF?(c.type==='in'?+c.amount:-c.amount):(c.type==='in'&&c.cat==='부모님 자금 이체'?-c.amount:0);
  const bal=(+f.start||0)+after.reduce((s,c)=>s+(delta(c)||0),0);
  const monthlyIn=(f.incomes||[]).reduce((s,r)=>s+(+r.amount||0),0);
  // 최근 3개월(이번 달 제외) 부모님 자금에서 나간 돈의 평균으로 소진 시점 추정
  const cm=t.slice(0,7),months=[1,2,3].map(n=>shiftYM(cm,-n)).filter(m=>m>=f.startDate.slice(0,7));
  const outOf=m=>S.care.filter(c=>c.date.startsWith(m)&&(c.who===SELF&&c.type==='out'||c.type==='in'&&c.cat==='부모님 자금 이체')).reduce((s,c)=>s+(+c.amount||0),0);
  const thisOut=outOf(cm);
  const fixedOut=S.recur.filter(r=>r.active&&ownerOf(r)==='parent'&&(r.from||SELF)===SELF).reduce((x,r)=>x+(+r.amount||0),0);
  const histAvg=months.length?Math.round(months.reduce((s,m)=>s+outOf(m),0)/months.length):0;
  const basis=months.length>=3?'hist':fixedOut?'fixed':months.length?'hist':'this';
  const avgOut=basis==='hist'?histAvg:basis==='fixed'?fixedOut:thisOut;
  const net=monthlyIn-avgOut;
  const runway=net<0?Math.floor(bal/-net):null;
  const series=[-5,-4,-3,-2,-1,0].map(n=>{const m=shiftYM(cm,n),end=m===cm?t:m+'-31';
    return {label:Number(m.slice(5))+'월',value:m<f.startDate.slice(0,7)?0:Math.max(0,(+f.start||0)+S.care.filter(c=>c.date>=f.startDate&&c.date<=end).reduce((s,c)=>s+(delta(c)||0),0)),hi:m===cm};});
  const thisIn=S.care.filter(c=>c.date.startsWith(cm)&&c.who===SELF&&c.type==='in').reduce((s,c)=>s+(+c.amount||0),0);
  const byMonth=months.slice().reverse().map(m=>({m,v:outOf(m)}));
  return {bal,monthlyIn,avgOut,net,runway,series,thisIn,thisOut,based:months.length,basis,fixedOut,byMonth};
}
// 잔액이 어떻게 나왔는지 한 줄씩 보여 줌 (원금 + 들어온 돈 − 나간 돈, 시작일 이후 기록만)

/* ---------- 운동 독려 ----------
   등산: 매주(월~일) 1회 이상이 목표. 헬스: 마지막 운동 후 3일째부터 독려. */
function shiftWeek(ws,n){const d=parseD(ws);d.setDate(d.getDate()+n*7);return fmtD(d);}
// 산행 한 건 요약: 날짜 · 거리 · 시간 · 걸음
function hikeLine(h){const m=hikeMinutes(h);return [`${Number(h.date.slice(5,7))}/${Number(h.date.slice(8))}`,h.distance?h.distance+'km':'',m.m?(m.est?'약 ':'')+hm(m.m):'',h.steps?num(h.steps)+'보':''].filter(Boolean).join(' · ');}
// 누적: 올해 / 전체
function hikeTotals(){
  const y=today().slice(0,4),yr=S.hike.filter(h=>h.date.startsWith(y));
  const km=a=>Math.round(a.reduce((x,h)=>x+(+h.distance||0),0)*10)/10,mins=a=>a.reduce((x,h)=>x+hikeMinutes(h).m,0);
  return `올해 ${yr.length}회 · ${km(yr)}km · ${hm(mins(yr))} · 누적 ${S.hike.length}회 ${km(S.hike)}km · 오른 산 ${new Set(S.hike.filter(h=>h.summit!==false).map(h=>h.mountain)).size}곳`;
}
function gymLine(list){
  const str=list.filter(g=>g.kind==='근력'),car=list.filter(g=>g.kind!=='근력');
  const parts=[];
  if(str.length)parts.push(`${esc(str[0].name||'근력')}${str[0].weight?' '+str[0].weight+'kg':''}${str[0].sets&&str[0].reps?` ${str[0].sets}×${str[0].reps}`:''}${str.length>1?` 외 ${str.length-1}개`:''}`);
  if(car.length)parts.push(`${esc(car[0].kind)} ${car.reduce((x,g)=>x+(+g.minutes||0),0)}분`);
  const kc=list.reduce((x,g)=>x+(+g.kcal||0),0);if(kc)parts.push(num(kc)+'kcal');
  return parts.join(' · ');
}
function gymTotals(){
  const t=today(),y=t.slice(0,4),ym=t.slice(0,7),days=a=>new Set(a.map(g=>g.date)).size,yr=S.gym.filter(g=>g.date.startsWith(y));
  return `이번 달 ${days(S.gym.filter(g=>g.date.startsWith(ym)))}일 · 올해 ${days(yr)}일 ${hm(yr.reduce((x,g)=>x+(+g.minutes||0),0))} · 누적 ${days(S.gym)}일`;
}
function hikeNudge(){
  const t=today(),ws=weekStart(t),dow=(parseD(t).getDay()+6)%7,left=6-dow;
  const past=S.hike.filter(h=>h.date<=t).sort((a,b)=>b.date.localeCompare(a.date));
  const thisWk=past.filter(h=>h.date>=ws);
  let streak=0,w=thisWk.length?ws:shiftWeek(ws,-1);
  while(past.some(h=>weekStart(h.date)===w)){streak++;w=shiftWeek(w,-1);}
  const last=past[0],since=last?-dday(last.date):null;
  const st=streak>1?`<span class="streak">${streak}주 연속</span>`:'';
  if(thisWk.length)return {editId:thisWk[0].id,cls:'done',title:`이번 주 산행 완료 ✔ ${esc(thisWk[0].mountain)}${thisWk[0].peak?' '+esc(thisWk[0].peak):''}`+st,sub:hikeLine(thisWk[0])+(thisWk.length>1?` · 이번 주 ${thisWk.length}회`:''),sub2:hikeTotals(),btn:'＋ 기록'};
  const lastTxt=last?`마지막 산행 ${esc(last.mountain)} · ${since}일 전`:'아직 산행 기록이 없어요';
  const keep=streak?` ${streak}주 연속 기록이 끊기기 직전이에요.`:'';
  if(left===0)return {cls:'warn urgent',title:'오늘이 이번 주 마지막 날! 아직 산에 못 갔어요',sub:`가까운 산 한 바퀴라도 다녀오세요.${keep} ${lastTxt}`,btn:'＋ 기록'};
  if(left<=2)return {cls:'warn urgent',title:`이번 주가 ${left+1}일 남았어요. 등산 가세요!`,sub:`이번 주 산행 0회.${keep} ${lastTxt}`,btn:'＋ 기록'};
  return {cls:'warn',title:'이번 주 등산 아직이에요. 산행 계획을 세워볼까요?',sub:`매주 1회 산행이 목표예요. ${lastTxt}`,btn:'＋ 기록'};
}
function hikeNudgeFull(){const n=hikeNudge();if(!n.sub2&&S.hike.length)n.sub2=hikeTotals();return n;}
function gymNudge(){
  const t=today(),past=S.gym.filter(g=>g.date<=t).sort((a,b)=>b.date.localeCompare(a.date)),last=past[0];
  const wkDays=new Set(past.filter(g=>g.date>=weekStart(t)).map(g=>g.date)).size;
  if(!last)return {cls:'warn',title:'헬스 기록이 아직 없어요. 오늘 30분부터 시작해요!',sub:'근력은 세트·횟수, 런닝머신은 시간·칼로리만 적으면 돼요.',btn:'＋ 기록'};
  const d=-dday(last.date);
  const lastDay=past.filter(g=>g.date===last.date);
  if(d===0)return {cls:'done',title:'오늘 운동 완료 ✔ 잘하셨어요!',sub:`${gymLine(lastDay)} · 이번 주 ${wkDays}일`,sub2:gymTotals(),btn:'＋ 추가'};
  if(d<3)return {cls:'',title:`마지막 운동 ${d}일 전 · ${3-d}일 안에 다시 운동하세요`,sub:`${Number(last.date.slice(5,7))}/${Number(last.date.slice(8))} ${gymLine(lastDay)} · 이번 주 ${wkDays}일`,sub2:gymTotals(),btn:'＋ 기록'};
  if(d<7)return {cls:'warn urgent',title:`헬스 ${d}일째 쉬는 중이에요. 오늘은 꼭 운동하세요!`,sub:'런닝머신 20분만 걸어도 다시 시작이에요. 미루면 습관이 끊겨요.',btn:'＋ 기록'};
  return {cls:'warn urgent',title:`벌써 ${d}일째 운동을 안 했어요!`,sub:'오래 쉬었다면 평소 무게의 절반, 가벼운 유산소부터 다시 시작하세요.',btn:'＋ 기록'};
}
function nudgeBox(which=['hike','gym']){
  const map={hike:[hikeNudgeFull,'addHike'],gym:[gymNudge,'addGym']};
  return `<section class="nudge">${which.map(k=>{const n=map[k][0]();if(!n.sub2&&k==='gym'&&S.gym.length)n.sub2=gymTotals();return `<div class="nrow ${n.cls}" style="--acc:var(--c-${k});cursor:pointer" ${n.editId?`data-act="edit${k==='hike'?'Hike':'Gym'}" data-id="${n.editId}"`:`data-act="go" data-tab="${k}"`}>${ICON[k]}<div class="grow"><b>${n.title}</b><small>${n.sub}</small>${n.sub2?`<small style="color:var(--acc);font-weight:600">${n.sub2}</small>`:''}</div><button class="btn sm${n.cls.includes('warn')?' primary':''}" data-act="${map[k][1]}">${n.btn}</button></div>`;}).join('')}</section>`;
}

/* ---------- 홈 ---------- */
function collectAlerts(){
  const a=[];
  S.rules.map(maintStatus).filter(s=>s.level==='over'||s.level==='soon').forEach(s=>a.push({tab:'car',level:s.level,badge:s.label,title:`${s.rule.item} 교체`,sub:[s.remKm!=null?(s.remKm>0?num(s.remKm)+'km 남음':num(-s.remKm)+'km 초과'):'',s.nextDate?s.nextDate+' ('+ddayLabel(s.days)+')':''].filter(Boolean).join(' · '),k:s.level==='over'?-9999:(s.days??30)}));
  S.sched.forEach(s=>{const nx=schedNext(s),n=dday(nx);if(n<=(s.alert??30))a.push({tab:'sched',level:n<0?'over':n<=7?'soon':'info',badge:ddayLabel(n),title:s.title,sub:nx+' · '+s.cat,k:n});});
  const ym=today().slice(0,7);
  receiptDue().forEach(d=>a.push({tab:ownerOf(d.r)==='parent'?'care':'recur',act:'receipt',id:d.r.id,ym:d.ym,level:dday(d.date)<0?'over':'soon',badge:'영수증',title:`${d.r.name} ${Number(d.ym.slice(5))}월분 금액 입력`,sub:`예상 ${won(d.r.amount)} · 눌러서 영수증 금액 입력`,k:-70}));
  const stale=S.accounts.filter(x=>staleDays(x)>30);
  if(stale.length)a.push({tab:'assets',level:'soon',badge:'잔액 확인',title:`${stale.map(x=>x.name).slice(0,2).join(', ')}${stale.length>2?` 외 ${stale.length-2}개`:''} 잔액 업데이트`,sub:'확인한 지 30일이 넘었어요 · 통장 앱 금액으로 맞추기',k:-40});
  const chk=[...S.tx.filter(t=>t.check).map(()=>'ledger'),...S.care.filter(c=>c.check).map(()=>'care')];

/* ---------- 앱 잠금 ----------
   숫자 비밀번호(4~6자리)는 원문을 저장하지 않고 무작위 값과 섞은 해시만 저장(계정 동기화로 모든 기기에 적용).
   다른 사람이 휴대폰을 집어 들었을 때 기록을 못 보게 하는 화면 잠금이다. */
const LOCK_ICON=ic('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
const AUTO=[[0,'열 때마다'],[1,'1분 뒤'],[5,'5분 뒤'],[30,'30분 뒤']];
let unlocked=false,pinBuf='',lockMsg='',lockErr=false,fails=0,waitUntil=0,lastActive=Date.now();
const lockOn=()=>!!(S.lock&&S.lock.hash);
const needLock=()=>lockOn()&&!unlocked;
// 새로고침 직후(1분 이내)에는 다시 묻지 않음. 단 '열 때마다' 설정이면 항상 묻는다
try{const t=+sessionStorage.getItem(KEY+'.active');if(t&&Date.now()-t<60000&&S.lock&&S.lock.auto!==0)unlocked=true;}catch(e){}
async function hashPin(pin,salt){
  const txt=salt+':'+pin;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=2166136261;for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return 'f'+h.toString(16);
}
const newSalt=()=>{const a=new Uint8Array(12);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');};
function touch(){lastActive=Date.now();try{sessionStorage.setItem(KEY+'.active',String(lastActive));}catch(e){}}
function lockNow(){if(!lockOn())return;unlocked=false;pinBuf='';lockMsg='';lockErr=false;try{sessionStorage.removeItem(KEY+'.active');}catch(e){}if(dlg.open)dlg.close();render();}
function lockHTML(){
  const n=S.lock.len||4,wait=Math.ceil((waitUntil-Date.now())/1000);
  return `<div class="lock"><div class="lock-box"><span class="logo">${LOCK_ICON}</span><h2>김현수 행정사 비밀노트</h2>
   <p class="${lockErr?'err':''}" id="lockMsg">${wait>0?`${wait}초 뒤에 다시 입력하세요`:esc(lockMsg||'비밀번호를 입력하세요')}</p>
   <div class="dots" id="dots">${Array.from({length:n},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-pin="${d}">${d}</button>`).join('')}<button class="sm" data-pin="hint">힌트</button><button data-pin="0">0</button><button class="sm" data-pin="del" aria-label="한 글자 지우기">지우기</button></div>
   <button class="linkbtn" data-pin="forgot">비밀번호를 잊었어요</button></div></div>`;
}
async function pinKey(k){
  if(!needLock())return;
  if(k==='hint'){toast(S.lock.hint?'힌트: '+S.lock.hint:'등록한 힌트가 없습니다');return;}
  if(k==='forgot'){
    if(await askConfirm('비밀번호는 되찾을 수 없습니다.\n잠금을 풀려면 이 앱의 모든 기록을 지우고 새로 시작해야 합니다.\n(백업 파일이 있으면 초기화한 뒤 설정에서 불러올 수 있습니다)','다음')&&await askConfirm('정말 모든 기록을 지울까요? 되돌릴 수 없습니다.','모두 지우고 초기화')){S=blank();unlocked=true;save();render();toast('초기화했습니다');}
    return;
  }
  if(Date.now()<waitUntil){render();return;}
  if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(/^\d$/.test(k)&&pinBuf.length<(S.lock.len||4))pinBuf+=k;
  lockErr=false;lockMsg='';
  if(pinBuf.length===(S.lock.len||4)){
    const ok=await hashPin(pinBuf,S.lock.salt)===S.lock.hash;pinBuf='';
    if(ok){unlocked=true;fails=0;touch();render();return;}
    fails++;lockErr=true;lockMsg=`비밀번호가 틀렸습니다 (${fails}회)`;
    if(fails>=5){waitUntil=Date.now()+30000*(fails-4);setTimeout(()=>{if(needLock())render();},30000*(fails-4)+50);}
    render();const d=$('#dots');if(d)d.classList.add('shake');return;
  }
  render();
}
async function lockSetup(change){
  const fields=[
    ...(change?[{k:'cur',label:'현재 비밀번호',type:'password',req:1,attrs:' inputmode="numeric" maxlength="6"'}]:[]),
    {k:'p1',label:'새 비밀번호 (숫자 4~6자리)',type:'password',req:1,attrs:' inputmode="numeric" maxlength="6" pattern="\\d{4,6}"'},
    {k:'p2',label:'새 비밀번호 확인',type:'password',req:1,attrs:' inputmode="numeric" maxlength="6"'},
    {k:'hint',label:'힌트 (선택, 잠금 화면에 보임)',type:'text',ph:'비밀번호 자체는 적지 마세요'},
    {k:'auto',label:'자동 잠금',type:'select',options:AUTO.map(([v,l])=>[String(v),l]),def:'5'}];
  openForm(change?'비밀번호 변경':'비밀번호 설정',fields,change?{hint:S.lock.hint,auto:String(S.lock.auto??5)}:null,async v=>{
    if(change&&await hashPin(v.cur,S.lock.salt)!==S.lock.hash){toast('현재 비밀번호가 틀렸습니다');return false;}
    if(!/^\d{4,6}$/.test(v.p1)){toast('숫자 4~6자리로 입력하세요');return false;}
    if(v.p1!==v.p2){toast('새 비밀번호가 서로 다릅니다');return false;}
    if(/^(\d)\1+$/.test(v.p1)||'0123456789'.includes(v.p1)||'9876543210'.includes(v.p1)){toast('같은 숫자 반복이나 연속 숫자는 피해 주세요');return false;}
    const salt=newSalt();S.lock={salt,hash:await hashPin(v.p1,salt),len:v.p1.length,hint:v.hint,auto:+v.auto};unlocked=true;touch();
  });
}
// 자동 잠금: 마지막 사용 후 설정한 시간이 지나면 잠금. '열 때마다'는 다른 앱에 다녀오면 잠금
