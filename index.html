<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<title>생활기록장</title>
<style>
:root{
  --bg:#f4f5f2;--card:#fff;--text:#1d2420;--muted:#66706a;--line:#e1e4df;
  --brand:#2f6f5e;--brand-weak:#e3efe9;
  --pos:#1f6fb2;--neg:#c2410c;
  --over:#b91c1c;--over-bg:#fde8e8;--soon:#a16207;--soon-bg:#fdf3d7;
  --ok:#15803d;--ok-bg:#e3f4e8;--info:#1d4ed8;--info-bg:#e4ebfd;--none:#6b7280;--none-bg:#eceef0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816;--card:#1e2421;--text:#e7ebe8;--muted:#9aa49e;--line:#2f3833;
  --brand:#6fc3a6;--brand-weak:#22352e;--pos:#7ab8f0;--neg:#f59e6b;
  --over:#fca5a5;--over-bg:#3b1d1d;--soon:#fcd34d;--soon-bg:#3a2f12;
  --ok:#86efac;--ok-bg:#16301f;--info:#a5b4fc;--info-bg:#1f2547;--none:#b0b6bd;--none-bg:#2a2f33;
}}
:root[data-theme="dark"]{
  --bg:#141816;--card:#1e2421;--text:#e7ebe8;--muted:#9aa49e;--line:#2f3833;
  --brand:#6fc3a6;--brand-weak:#22352e;--pos:#7ab8f0;--neg:#f59e6b;
  --over:#fca5a5;--over-bg:#3b1d1d;--soon:#fcd34d;--soon-bg:#3a2f12;
  --ok:#86efac;--ok-bg:#16301f;--info:#a5b4fc;--info-bg:#1f2547;--none:#b0b6bd;--none-bg:#2a2f33;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header.top{background:var(--brand);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
:root[data-theme="dark"] header.top{color:#0f1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{color:#0f1a16}}
header.top{display:flex;align-items:center;gap:8px}header.top h1{margin:0;font-size:18px;flex:1}#sync{font-size:12px;opacity:.85}
nav#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:6px 8px;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav#tabs button.on{background:var(--brand-weak);color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn,.quick button,.toolbar button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font-weight:600}
.quick button{padding:10px 4px;font-size:13px}
.btn.primary,button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] button.primary,:root[data-theme="dark"] .btn.primary{color:#0f1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary,:root:not([data-theme="light"]) .btn.primary{color:#0f1a16}}
.btn.sm{padding:4px 10px;font-size:13px}
.danger{color:var(--over)!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.monthnav{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12.5px}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.daygrp{font-size:12.5px;color:var(--muted);margin:12px 2px 2px;display:flex;justify-content:space-between}
.pill{flex:0 0 auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.over{color:var(--over);background:var(--over-bg)}.pill.soon{color:var(--soon);background:var(--soon-bg)}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.info{color:var(--info);background:var(--info-bg)}
.pill.none{color:var(--none);background:var(--none-bg)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.warn span{background:var(--soon)}.bar.over span{background:var(--over)}
.catrow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.catrow .bar{margin:0}
.empty{color:var(--muted);text-align:center;padding:14px 0;margin:0}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#dlgForm{padding:16px;overflow:auto}
#dlgForm h2{margin:0 0 12px;font-size:17px}
.fld{margin-bottom:10px}
.fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.actions{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:-16px;background:var(--card);padding:10px 0}
.actions .sp{flex:1}
.actions button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 16px;font-weight:600}
.rule{display:grid;grid-template-columns:1fr 78px 20px 60px 26px 30px;gap:4px;align-items:center;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.rule input{padding:6px}
.rule button{border:0;background:none;color:var(--over);font-size:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
svg.spark{width:100%;height:60px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;border-top:0;font-size:12.5px}
.tbl tr[data-act]{cursor:pointer}
.tbl td.r,.tbl th.r{text-align:right}
@media (max-width:420px){
  .stat b{font-size:13.5px}
  .tbl .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top"><h1>생활기록장</h1><span id="sync"></span></header>
<nav id="tabs"></nav>
<main id="view"></main>
<dialog id="dlg"><form id="dlgForm" novalidate></form></dialog>
<dialog id="cfm"><form id="cfmForm" style="padding:16px"><p id="cfmMsg" style="white-space:pre-line;margin:0 0 4px"></p><div class="actions"><span class="sp"></span><button type="button" id="cfmNo">취소</button><button type="submit" class="primary" id="cfmYes">확인</button></div></form></dialog>
<div id="toast"></div>
<script>
'use strict';
/* ---------- 기본 데이터 ---------- */
const KEY='lifebook.v1';
const CAT_OUT=['식비','외식·카페','생활용품','주거·관리비','공과금','통신','교통·차량','의료·건강','보험','경조사','교육','문화·여가','의류·미용','용돈','저축·투자','세금','기타'];
const CAT_IN=['급여','연금','사업소득','이자·배당','용돈','환급','경조금','기타'];
const PAY=['카드','현금','계좌이체','간편결제','자동이체'];
// 일반적 권장 주기(차량·운행조건마다 다름 → 취급설명서 기준으로 수정)
const DEFAULT_RULES=[
  {item:'엔진오일',km:7000,months:6},{item:'오일필터',km:7000,months:6},
  {item:'에어컨필터',km:10000,months:6},{item:'에어클리너',km:15000,months:12},
  {item:'타이어 위치교환',km:10000,months:12},{item:'브레이크패드',km:30000,months:24},
  {item:'와이퍼',km:0,months:12},{item:'냉각수',km:40000,months:24},
  {item:'브레이크오일',km:40000,months:24},{item:'배터리',km:0,months:36},
  {item:'미션오일',km:60000,months:48},{item:'점화플러그',km:60000,months:48},
  {item:'타이어 교체',km:50000,months:48}
];
const SCHED_CAT=['자동차','보험','건강','신분·면허','자격·교육','세금·공과','가족·기념일','기타'];
const SCHED_TITLES=['자동차보험 만기','자동차 정기검사','자동차세 연납','운전면허 적성검사·갱신','국가건강검진','암검진','여권 만료','실손보험 갱신','재산세 납부(7월)','재산세 납부(9월)','종합소득세 신고(5월)','자격증 보수교육','부모님 생신','결혼기념일','제사'];
const REPEAT=[['none','반복 없음'],['1m','매월'],['6m','6개월마다'],['1y','매년'],['2y','2년마다'],['5y','5년마다'],['10y','10년마다']];
const REPEAT_M={none:0,'1m':1,'6m':6,'1y':12,'2y':24,'5y':60,'10y':120};
const GIFT_KIND=['결혼','부고(조의)','돌·생일','회갑·칠순','개업·이전','병문안','출산','기타'];
const GIFT_REL=['가족·친척','친구','직장','이웃·지인','모임·동호회','기타'];

function blank(){return {tx:[],budget:0,car:{name:'',plate:'',odo:0,fuelType:'휘발유',year:''},rules:DEFAULT_RULES.map(r=>({...r})),maint:[],fuel:[],recur:[],sched:[],gift:[],health:[]};}
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}cloud.push();}
/* ---------- 클라우드 동기화 (claude.ai 아티팩트로 열었을 때) ----------
   본인 전용 경로 data/users/<id>/ 에 저장 → 같은 계정이면 휴대폰·PC 어디서나 같은 기록,
   다른 사람은 볼 수 없음. 가계부는 연도별 문서로 나눠 문서 크기 제한을 피함. */
const cloud={db:null,base:null,sent:{},timer:null,busy:false,again:false,
  docs(){
    const out={meta:{budget:S.budget,car:S.car,rules:S.rules}};
    for(const k of ['maint','fuel','recur','sched','gift','health'])out[k]={items:S[k]};
    const years={};S.tx.forEach(t=>{(years[t.date.slice(0,4)]||=[]).push(t);});
    for(const y in years)out['tx-'+y]={items:years[y]};
    for(const id in this.sent)if(id.startsWith('tx-')&&!out[id])out[id]=null; // 비워진 연도는 삭제
    return out;
  },
  push(){if(!this.db)return;this.pending=true;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),400);},
  async flush(){
    if(this.busy){this.again=true;return;}
    this.busy=true;setSync('저장 중…');
    try{
      const docs=this.docs();
      for(const id in docs){
        const body=docs[id],js=body?JSON.stringify(body):null;
        if(this.sent[id]===js)continue;
        const ref=this.db.collection(this.base).doc(id);
        if(body)await ref.set(body);else await ref.delete();
        if(js)this.sent[id]=js;else delete this.sent[id];
      }
      setSync('☁ 동기화됨');
    }catch(e){setSync('⚠ 저장 실패');toast(e&&e.code==='quota_exceeded'?'저장공간이 가득 찼습니다. 오래된 기록을 정리하세요':'서버 저장에 실패했습니다. 잠시 후 다시 시도됩니다');setTimeout(()=>this.push(),5000);}
    this.busy=false;if(this.again){this.again=false;this.flush();}else this.pending=false;
  },
  apply(snap){
    if(snap.metadata.hasPendingWrites||this.busy||this.pending)return;
    const got={};snap.docs.forEach(d=>{got[d.id]=d.data();});
    const n=blank();
    if(got.meta){n.budget=got.meta.budget||0;n.car={...n.car,...got.meta.car};if(Array.isArray(got.meta.rules))n.rules=got.meta.rules;}
    for(const k of ['maint','fuel','recur','sched','gift','health'])if(got[k])n[k]=JSON.parse(JSON.stringify(got[k].items||[]));
    for(const id in got)if(id.startsWith('tx-'))n.tx.push(...JSON.parse(JSON.stringify(got[id].items||[])));
    this.sent={};for(const id in got)this.sent[id]=JSON.stringify(got[id]);
    S=n;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(!dlg.open)render();
  },
  async start(){
    if(!window.claude?.use)return setSync('이 기기에만 저장');
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id)return setSync('이 기기에만 저장');
    this.base='data/users/'+id;
    let first;
    try{first=await db.collection(this.base).get();}catch(e){return setSync('이 기기에만 저장');}
    this.db=db;
    if(first.empty){ // 처음: 이 기기에 있던 기록을 올림
      if(S.tx.length||S.maint.length||S.fuel.length||S.recur.length||S.sched.length||S.gift.length||S.health.length||S.car.name)await this.flush();
      else setSync('☁ 동기화됨');
    }else{this.apply(first);setSync('☁ 동기화됨');}
    db.collection(this.base).onSnapshot(s=>this.apply(s),()=>setSync('⚠ 연결 끊김'));
  }
};
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t;}

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(Number(n)||0).toLocaleString('ko-KR');
const won=n=>num(n)+'원';
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>fmtD(new Date());
function parseD(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);}
function addMonths(s,m){const d=parseD(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmtD(d);}
const dday=s=>Math.round((parseD(s)-parseD(today()))/864e5);
const ddayLabel=n=>n===0?'D-Day':n>0?'D-'+n:'D+'+(-n);
const ymLabel=ym=>{const [y,m]=ym.split('-');return `${y}년 ${Number(m)}월`;};
function shiftYM(ym,n){return addMonths(ym+'-01',n).slice(0,7);}
const WD=['일','월','화','수','목','금','토'];
const dLabel=s=>{const d=parseD(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}
function askConfirm(msg,yes){
  return new Promise(res=>{const d=$('#cfm');$('#cfmMsg').textContent=msg;$('#cfmYes').textContent=yes||'확인';
    $('#cfmNo').onclick=()=>{d.close();res(false);};$('#cfmForm').onsubmit=e=>{e.preventDefault();d.close();res(true);};d.oncancel=()=>res(false);d.showModal();});
}
function addTx(o){S.tx.push({id:uid(),pay:'',memo:'',...o});}

/* ---------- 공용 입력 폼 ---------- */
const dlg=$('#dlg'),dlgForm=$('#dlgForm');
function optHTML(opts,val){return opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`;}).join('');}
function fieldHTML(fd,val){
  if(val===undefined||val===null)val=typeof fd.def==='function'?fd.def():(fd.def??'');
  const id='f_'+fd.k,req=fd.req?' required':'';
  if(fd.type==='checkbox')return `<div class="fld chk"><label><input type="checkbox" name="${fd.k}"${val?' checked':''}> ${esc(fd.label)}</label></div>`;
  let input;
  if(fd.type==='select')input=`<select id="${id}" name="${fd.k}"${req}>${fd.dep?'':optHTML(fd.options,val)}</select>`;
  else if(fd.type==='textarea')input=`<textarea id="${id}" name="${fd.k}">${esc(val)}</textarea>`;
  else{
    const extra=fd.type==='number'?` inputmode="${fd.dec?'decimal':'numeric'}" step="${fd.dec?'any':'1'}" min="0"`:'';
    const list=fd.list?` list="${id}_l"`:'';
    input=`<input id="${id}" name="${fd.k}" type="${fd.type||'text'}" value="${esc(val)}"${extra}${list}${req} placeholder="${esc(fd.ph||'')}" autocomplete="off">`+
      (fd.list?`<datalist id="${id}_l">${(typeof fd.list==='function'?fd.list():fd.list).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'');
  }
  return `<div class="fld"><label for="${id}">${esc(fd.label)}${fd.req?' *':''}</label>${input}</div>`;
}
function openForm(title,fields,rec,onSave,onDelete){
  dlgForm.innerHTML=`<h2>${esc(title)}</h2>`+fields.map(fd=>fieldHTML(fd,rec?rec[fd.k]:undefined)).join('')+
    `<div class="actions">${onDelete?'<button type="button" class="danger" data-x="del">삭제</button>':''}<span class="sp"></span><button type="button" data-x="cancel">취소</button><button type="submit" class="primary">저장</button></div>`;
  fields.filter(fd=>fd.dep).forEach(fd=>{
    const el=dlgForm.elements.namedItem(fd.k),dep=dlgForm.elements.namedItem(fd.dep);
    const fill=keep=>{const cur=keep??el.value;el.innerHTML=optHTML(fd.map[dep.value]||[],cur);};
    dep.addEventListener('change',()=>fill());fill(rec?rec[fd.k]:undefined);
  });
  dlgForm.querySelector('[data-x=cancel]').onclick=()=>dlg.close();
  const del=dlgForm.querySelector('[data-x=del]');

function maintStatus(rule){
  const recs=S.maint.filter(m=>m.item===rule.item).sort((a,b)=>b.date.localeCompare(a.date)||(b.km||0)-(a.km||0));
  const last=recs[0];
  if(!last)return {rule,level:'none',label:'기록없음'};
  const odo=currentOdo();
  const nextKm=rule.km>0&&last.km!=null?last.km+rule.km:null;
  const nextDate=rule.months>0?addMonths(last.date,rule.months):null;
  const remKm=nextKm!=null?nextKm-odo:null,days=nextDate?dday(nextDate):null;
  let level='ok';
  if((remKm!=null&&remKm<=0)||(days!=null&&days<0))level='over';
  else if((remKm!=null&&remKm<=1000)||(days!=null&&days<=30))level='soon';
  return {rule,last,nextKm,nextDate,remKm,days,level,label:{over:'교체필요',soon:'임박',ok:'양호'}[level]};
}
function fuelStats(){
  const arr=[...S.fuel].sort((a,b)=>(a.odo||0)-(b.odo||0));
  let lastFull=null,acc=0;const eff={};
  for(const f of arr){
    acc+=+f.liters||0;
    if(f.full){if(lastFull!=null&&f.odo>lastFull&&acc>0)eff[f.id]=(f.odo-lastFull)/acc;lastFull=f.odo;acc=0;}
  }
  const vals=Object.values(eff);
  return {eff,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
}

function bpClass(s,d){if(!s||!d)return null;if(s>=140||d>=90)return ['고혈압 범위','over'];if(s>=130||d>=80)return ['고혈압 전단계','soon'];if(s>=120)return ['주의혈압','info'];return ['정상','ok'];}
function sugarClass(v,when){if(!v||when!=='공복')return null;if(v>=126)return ['당뇨 의심 범위','over'];if(v>=100)return ['공복혈당장애 범위','soon'];return ['정상','ok'];}
function spark(vals,color){
  if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,w=300,h=56;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-(v-mn)/rg*(h-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function view_health(){

  <section class="card"><div class="stats">

   ${sysV.length>1?`<p class="hint" style="margin-top:10px">수축기 혈압 추이 (최근 ${sysV.length}회)</p>${spark(sysV,'var(--neg)')}`:''}
   ${wV.length>1?`<p class="hint">체중 추이 (최근 ${wV.length}회)</p>${spark(wV,'var(--pos)')}`:''}

  }),
  editGift:d=>crud('gift','경조사 기록',giftFields,find('gift',d.id)),
  addHealth:()=>crud('health','측정 기록',healthFields,null),
  editHealth:d=>crud('health','측정 기록',healthFields,find('health',d.id)),
  backup:()=>{const t=today();download(`생활기록장_백업_${t}.json`,JSON.stringify({app:'lifebook',version:1,exported:new Date().toISOString(),data:S},null,1),'application/json');try{localStorage.setItem(KEY+'.lastBackup',t);}catch(e){}setTimeout(render,300);},
  restore:()=>$('#restoreFile').click(),
  csv:()=>{
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['날짜','구분','분류','금액','결제수단','내용'],...[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'수입':'지출',t.cat,t.amount,t.pay,t.memo])];
    download(`가계부_${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
  },
  theme:d=>{if(d.v)document.documentElement.dataset.theme=d.v;else delete document.documentElement.dataset.theme;try{localStorage.setItem(KEY+'.theme',d.v);}catch(e){}},
  reset:async()=>{if(await askConfirm('모든 기록을 삭제합니다. 백업하셨나요?','다음')&&await askConfirm('정말 삭제할까요? 되돌릴 수 없습니다.','모두 삭제')){S=blank();save();render();toast('초기화했습니다');}}
};
$('#view').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset);});
$('#view').addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='ledgerQ'||id==='giftQ'){
    if(id==='ledgerQ')ledgerQ=e.target.value;else giftQ=e.target.value;
    const pos=e.target.selectionStart;render();const el=$('#'+id);el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}
  }
});
$('#view').addEventListener('change',e=>{
  if(e.target.id==='schedCat'){schedCat=e.target.value;render();}
  if(e.target.id==='restoreFile'){
    const file=e.target.files[0];if(!file)return;
    e.target.value='';
    file.text().then(async txt=>{
      const o=JSON.parse(txt),d=o&&o.app==='lifebook'?o.data:o;
      if(!d||typeof d!=='object'||!Array.isArray(d.tx))throw new Error('형식 오류');
      if(!await askConfirm('현재 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?','복원'))return;
      S=Object.assign(blank(),d);save();render();toast('복원했습니다');
    }).catch(()=>toast('올바른 백업 파일이 아닙니다'));
  }
});
try{const th=localStorage.getItem(KEY+'.theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
render();
cloud.start();
</script>
</body>
</html>
