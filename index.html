     <p class="hint" style="margin:12px 0 6px">③ 매달 연금 — <b>통장에 들어오는 금액</b>만 넣으세요. 올해는 그대로, 내년 1월에 오른 금액으로 고치면 됩니다.</p>
     <div id="frows">${inc.map(row).join('')}</div><button type="button" class="btn sm" id="addF">＋ 연금 추가</button>
     <details style="margin-top:14px"><summary class="hint" style="cursor:pointer;margin:0">더 보기 — 보관 위치·통장 연결</summary>
      <label class="fld chk" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="finmine"${f.inMine!==false?' checked':''}> 내 통장·증권에 보관 중 (내 순자산에서 빼고 보여주기)</label>
      <div class="fld"><label for="facct">연금이 들어오고 병원비가 나가는 통장</label><select id="facct">${optHTML([['','지정 안 함'],...S.accounts.filter(a=>a.type!=='loan').map(a=>[a.id,a.name])],f.startDate?(f.acct||''):(f.acct||mainAcct()))}</select></div>
      <p class="hint" style="margin-top:-4px">고르면 ${esc(careName())} 돈의 입출금이 그 통장 잔액에도 바로 반영됩니다.</p>
      <div class="fld"><label for="fn">보관 위치 메모</label><input id="fn" value="${esc(f.note||'')}" placeholder="예: 농협 통장·키움 증권에 나눠 보관"></div>
     </details>
     <div class="actions"><span class="sp"></span><button type="button" data-x="cancel">취소</button><button type="submit" class="primary">저장</button></div>`;
    const box=dlgForm.querySelector('#frows');
    box.onclick=e=>{if(e.target.closest('.x'))e.target.closest('.rule').remove();};
    dlgForm.querySelector('#addF').onclick=()=>{box.insertAdjacentHTML('beforeend',row({who:'',kind:'기타 연금',amount:'',day:25,id:uid()}));prev();};
    // 저장 전에 결과 잔액을 미리 보여줌
    const prev=()=>{
      const st=+dlgForm.querySelector('#fs').value||0,sd=dlgForm.querySelector('#fsd').value,t=today();
      if(!$('#fprev'))return;
      if(!sd){$('#fprev').textContent='';return;}
      let cnt=0,sum=0;
      [...box.querySelectorAll('.rule')].forEach(r=>{const a=+r.querySelector('.fa').value||0,day=+r.querySelector('.fd').value||25;if(!a||!r.querySelector('.fw').value.trim())return;
        for(let ym=sd.slice(0,7),g=0;ym<=t.slice(0,7)&&g<600;ym=shiftYM(ym,1),g++){const last=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate(),d=`${ym}-${String(Math.min(day,last)).padStart(2,'0')}`;if(d>=sd&&d<=t&&!(f.skip||[]).includes(`pen-${ym}-${r.dataset.id}`)){cnt++;sum+=a;}}});
      const other=S.care.filter(c=>!c.auto&&c.date>=sd&&c.date<=t).reduce((s,c)=>s+(c.who===SELF?(c.type==='in'?+c.amount:-c.amount):(c.type==='in'&&c.cat==='부모님 자금 이체'?-c.amount:0)),0);
      $('#fprev').innerHTML=`원금 ${won(st)} + 시작일 이후 연금 ${cnt}건 ${won(sum)}${other?` ${other>0?'+':'−'} 그 밖의 입출금 ${won(Math.abs(other))}`:''}<br>= 지금 ${esc(careName())} 돈 <b>${won(st+sum+other)}</b> <span style="color:var(--muted)">(${korWon(st+sum+other)})</span>`;
    };
    ['#fs','#fsd','#frows'].forEach(q=>dlgForm.querySelector(q).addEventListener('input',prev));box.addEventListener('click',()=>setTimeout(prev));setTimeout(prev);
    dlgForm.querySelector('[data-x=cancel]').onclick=()=>dlg.close();
    dlgForm.onsubmit=e=>{e.preventDefault();
      const start=+dlgForm.querySelector('#fs').value||0,startDate=dlgForm.querySelector('#fsd').value;
      if(!startDate){toast('기준일을 입력하세요');return;}
      const incomes=[...box.querySelectorAll('.rule')].map(r=>({id:r.dataset.id,who:r.querySelector('.fw').value.trim(),kind:r.querySelector('.fk').value,amount:+r.querySelector('.fa').value||0,day:Math.min(31,Math.max(1,+r.querySelector('.fd').value||25))})).filter(r=>r.who);
      S.careCfg.fund={start,startDate,inMine:dlgForm.querySelector('#finmine').checked,acct:dlgForm.querySelector('#facct').value,note:dlgForm.querySelector('#fn').value.trim(),incomes,skip:f.skip||[],year:today().slice(0,4)};
      // 확인일 이전에 자동으로 들어갔던 연금 기록은 잔액에 이미 반영된 것이므로 정리
      S.care=S.care.filter(c=>!(c.auto&&c.date<startDate));
      postPensions();save();dlg.close();render();toast('저장했습니다');};
    showDlg();
  },
  careTrue:()=>{const fs=fundStats();if(!fs)return;
    openForm(`${careName()} 돈 잔액 맞추기`,[{k:'actual',label:`지금 실제 ${careName()} 돈 합계(원) — 농협·증권에 있는 몫을 모두 더한 금액`,type:'number',req:1},{k:'date',label:'확인한 날',type:'date',def:today,req:1}],null,v=>{
      const diff=Math.round(v.actual-fs.bal);
      if(!diff){toast('앱 잔액과 통장 잔액이 같습니다');return false;}
      S.care.push({id:uid(),type:diff>0?'in':'out',date:v.date,amount:Math.abs(diff),cat:'잔액 조정',who:SELF,memo:`통장 잔액 맞추기 (앱 ${num(fs.bal)} → 통장 ${num(v.actual)})`,tax:false});
      setTimeout(()=>toast(`차액 ${diff>0?'+':''}${num(diff)}원을 ‘잔액 조정’으로 기록했습니다`),0);
    });
    const h=dlgForm.querySelector('.actions');h.insertAdjacentHTML('beforebegin',`<p class="hint">앱이 계산한 잔액은 <b>${won(fs.bal)}</b>입니다. 통장 잔액을 넣으면 차액을 ‘잔액 조정’으로 기록해 맞춥니다. 차이가 크면 빠진 병원비·이자 기록이 없는지 먼저 확인하세요.</p>`);},
  careNav:d=>{careYM=shiftYM(careYM,+d.n);render();},
  careCsv:()=>{const [a,b,label]=careRange();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['날짜','구분','항목','금액','낸 사람·출처','내용','공제대상','영수증'],...S.care.filter(c=>c.date>=a&&c.date<=b).sort((x,y)=>x.date.localeCompare(y.date)).map(c=>[c.date,c.type==='in'?'입금':'지출',c.cat,c.amount,whoLabel(c.who),c.memo,c.tax?'O':'',c.receipt?'O':''])];
    download(`${careName()}_병원비_${label}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');},
  careCfg:()=>openForm(`${careName()} 정보`,[
    {k:'name',label:'호칭',type:'text',ph:'예: 아버지'},
    {k:'hospital',label:'병원',type:'text',ph:'예: ○○요양병원'},
    {k:'admit',label:'입원일',type:'date'}],{name:S.careCfg.name,hospital:S.careCfg.hospital,admit:S.careCfg.admit},v=>{Object.assign(S.careCfg,{name:v.name||'부모님',hospital:v.hospital,admit:v.admit});}),
  restoreBk:async d=>{let o;try{o=JSON.parse(localStorage.getItem(d.k));}catch(e){}if(!o||!o.data)return toast('보관본을 읽을 수 없습니다');
    if(!await askConfirm(`${(o.at||'').slice(0,16).replace('T',' ')} 보관본으로 되살릴까요?\n지금 기록은 바뀌기 전에 따로 보관해 둡니다.`,'되살리기'))return;
    backupLocal('되살리기 전 보관');S=Object.assign(blank(),o.data);save();render();toast('되살렸습니다. 다른 기기에도 반영됩니다');},
  lockSet:()=>lockSetup(false),
  lockChange:()=>lockSetup(true),
  lockNowAct:()=>lockNow(),
  lockOff:()=>openForm('잠금 끄기',[{k:'cur',label:'현재 비밀번호',type:'password',req:1,attrs:' inputmode="numeric" maxlength="6"'}],null,async v=>{
    if(await hashPin(v.cur,S.lock.salt)!==S.lock.hash){toast('비밀번호가 틀렸습니다');return false;}S.lock=null;}),
  addHike:()=>{openForm('산행 기록 추가',[...hikeFields(),{k:'_ledger',label:'경비를 가계부에도 기록',type:'checkbox',def:true}],null,v=>{
    const {_ledger,...r0}=v,r={id:uid(),ts:Date.now(),...r0};S.hike.push(r);
    linkNew('hike',r,_ledger);
    if(weekStart(r.date)===weekStart(today()))setTimeout(()=>{const w=weekStats();toast(`이번 주 유산소 ${w.cardio}분 / 150분${w.cardio>=150?' 달성!':''}`);},0);
  });hikeTimeHelper();},
  hikeFind:d=>{hikeQ=d.m;render();window.scrollTo(0,0);},
  editHike:d=>{crud('hike','산행 기록',hikeFields(),find('hike',d.id));hikeTimeHelper();},
  addGym:d=>crud('gym','운동 기록',gymFields(),null,(d.date||d.kind)?{date:d.date||today(),kind:d.kind||'근력'}:null),
  editGym:d=>crud('gym','운동 기록',gymFields(),find('gym',d.id)),
  gymYM:d=>{gymYM=shiftYM(gymYM,+d.n);render();},
  addLab:()=>crud('lab','검사 결과',labFields,null),
  editLab:d=>crud('lab','검사 결과',labFields,find('lab',d.id)),
  setProfile:()=>openForm('키·성별',[{k:'height',label:'키(cm)',type:'number',dec:1},{k:'sex',label:'성별 (허리둘레 기준에 사용)',type:'select',options:[['','선택 안 함'],['남','남'],['여','여']]}],S.profile,v=>{S.profile={height:v.height||'',sex:v.sex};}),
  addHealth:()=>crud('health','측정 기록',healthFields,null),
  editHealth:d=>crud('health','측정 기록',healthFields,find('health',d.id)),
  backup:()=>{const t=today();download(`비밀노트_백업_${t}.json`,JSON.stringify({app:'lifebook',version:1,exported:new Date().toISOString(),data:S},null,1),'application/json');try{localStorage.setItem(KEY+'.lastBackup',t);}catch(e){}setTimeout(render,300);},
  restore:()=>$('#restoreFile').click(),
  csv:()=>{
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['날짜','구분','분류','금액','결제수단','내용'],...[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'수입':'지출',t.cat,t.amount,t.pay,t.memo])];
    download(`가계부_${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
  },
  theme:d=>{if(d.v)document.documentElement.dataset.theme=d.v;else delete document.documentElement.dataset.theme;try{localStorage.setItem(KEY+'.theme',d.v);}catch(e){}},
  reset:async()=>{if(await askConfirm('모든 기록을 삭제합니다. 백업하셨나요?','다음')&&await askConfirm('정말 삭제할까요? 되돌릴 수 없습니다.','모두 삭제')){S=blank();save();render();toast('초기화했습니다');}}
};
$('#lockBtn').addEventListener('click',lockNow);
$('#view').addEventListener('click',e=>{const pk=e.target.closest('[data-pin]');if(pk){pinKey(pk.dataset.pin);return;}const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset);});
// 검색창: 한글은 자음·모음을 조합하는 동안 화면을 다시 그리면 입력이 끊기므로
// 조합 중에는 기다렸다가, 입력이 잠시 멈추면 결과만 갱신한다.
const SEARCH={ledgerQ:v=>ledgerQ=v,giftQ:v=>giftQ=v,hikeQ:v=>hikeQ=v};
let searchTimer=null,composing=false;
function runSearch(el){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    if(composing||!document.body.contains(el))return;
    SEARCH[el.id](el.value);const id=el.id,pos=el.selectionStart;
    render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
  },350);
}
$('#view').addEventListener('compositionstart',e=>{if(SEARCH[e.target.id])composing=true;});
$('#view').addEventListener('compositionend',e=>{if(SEARCH[e.target.id]){composing=false;runSearch(e.target);}});
$('#view').addEventListener('input',e=>{if(SEARCH[e.target.id]&&!e.isComposing&&!composing)runSearch(e.target);});
$('#view').addEventListener('change',e=>{
  if(e.target.id==='schedCat'){schedCat=e.target.value;render();}
  if(e.target.id==='hikeYear'){hikeYear=e.target.value;render();}
  if(e.target.id==='hikeSido'){hikeSido=e.target.value;render();}
  if(e.target.id==='careMode'){careMode=e.target.value;render();}
  if(e.target.id==='careY'){careY=e.target.value;render();}
  if(e.target.id==='restoreFile'){
    const file=e.target.files[0];if(!file)return;
    e.target.value='';
    file.text().then(async txt=>{
      const o=JSON.parse(txt),d=o&&o.app==='lifebook'?o.data:o;
      if(!d||typeof d!=='object'||!Array.isArray(d.tx))throw new Error('형식 오류');
      if(!await askConfirm('현재 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?','복원'))return;
      S=Object.assign(blank(),d);save();render();toast('복원했습니다');
    }).catch(()=>toast('올바른 백업 파일이 아닙니다'));
  }
});
try{const th=localStorage.getItem(KEY+'.theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
render();
if(autoPost())save();
cloud.start();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloud.refresh();});
</script>
</body>
</html>
